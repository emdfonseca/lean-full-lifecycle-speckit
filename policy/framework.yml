framework_version: "0.1.0"
policy_version: "0.1.0"

environment:
  manager: devbox
  require_lockfile: true
  forbid_undocumented_global_dependencies: true

spec_kit:
  minimum_version: "1.0.1"
  # The workflows follow the project's own integration rather than naming one.
  # `auto` is Spec Kit's runtime sentinel for exactly that.
  integration: auto
  # The integration this bundle is exercised against. Under test is not the
  # same as required, and a reader has to be able to tell them apart.
  reference_integration: opencode
  preset_stack:
    - id: lean
      priority: 20
      strategy: replace
    - id: lean-full-lifecycle-governance
      priority: 10
      strategy: append
  required_commands:
    - constitution
    - specify
    - clarify
    - plan
    - checklist
    - tasks
    - analyze
    - implement
    - converge

bootstrap:
  phases:
    - inspect
    - plan
    - approve
    - apply
    - read_back
    - validate
    - prove_idempotency

source_of_truth:
  work_item: github_issue
  structured_backlog_metadata: github_issue_fields
  intended_behavior: living_spec
  engineering_policy: constitution_and_installed_policy
  implementation: git
  verification: ci
  deployment: deployment_platform
  outcome_evidence: outcome_record
