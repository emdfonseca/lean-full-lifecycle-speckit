# Blocking is deliberately absent from these values. It is a modal attribute,
# not a phase: an item can be blocked while Refining, Ready, or In Progress, and
# making it a state destroys the phase it was in. Blocking is recorded as a
# native issue dependency, which is orthogonal and never changes the delivery
# state. See ADR 0004.
blocking:
  mechanism: native_issue_dependencies
  changes_delivery_status: false
  # An item that is Ready while blocked claims to be startable and is not.
  report_when: ready_and_blocked
  # And it is refused rather than only reported. With teams working in
  # parallel, that ordering is the only thing keeping one from building on
  # something that has not landed.
  refuses_transition_to: In Progress
  # A blocker here is judged by delivery state, the same way a child is: an
  # issue closed as a duplicate has not been delivered. A blocker in another
  # repository has no delivery state we can read, so closure is the only
  # signal, and the refusal says which of the two answered.
  # Refinement may run ahead of implementation for items with no open blocker,
  # since nothing in flight can change their shape. An item with an open
  # blocker should not be refined to Ready: the blocker may change what it
  # means.
  refine_ahead_requires: no_open_blocker

delivery_status:
  values:
    - Inbox
    - Refining
    - Ready
    - In Progress
    - Output Done
    - Retired
  # Which states end an item. Declared rather than inferred from position:
  # `states_asserting_work` read `values[1:-1]`, which silently encoded "one
  # terminal, last". Adding a second made `Output Done` assert work and would
  # have flagged every completed item (#160).
  terminal_states:
    - Output Done
    - Retired
  transitions:
    - from: null
      to: Inbox
      authority: automation_or_triage_policy
      evidence: [issue_exists]
    - from: Inbox
      to: Refining
      authority: triager_or_assigned_team
      evidence: [refinement_started]
    - from: Refining
      to: Ready
      authority: product_or_refinement_authority
      evidence: [readiness_verdict_ready]
    - from: Ready
      to: In Progress
      authority: assigned_engineering_owner
      evidence: [owner_assigned, work_started]
    - from: In Progress
      to: Output Done
      authority: automated_gates_and_authorized_review
      evidence:
        - acceptance_criteria_satisfied
        - required_ci_green
        - applicable_security_green
        - convergence_clear
        - operability_complete
    - from: Output Done
      to: In Progress
      authority: engineering_authority
      evidence: [reopen_reason]
    # Retirement ends an item that was never delivered. Reachable from every
    # live state, because work is abandoned wherever it happened to be -- and
    # leaving it where it was is how a closed item goes on claiming somebody is
    # working on it (#160).
    - from: Inbox
      to: Retired
      authority: triager_or_assigned_team
      evidence: [retirement_route, retirement_reason]
    - from: Refining
      to: Retired
      authority: triager_or_assigned_team
      evidence: [retirement_route, retirement_reason]
    - from: Ready
      to: Retired
      authority: product_or_refinement_authority
      evidence: [retirement_route, retirement_reason]
    - from: In Progress
      to: Retired
      authority: assigned_engineering_owner
      evidence: [retirement_route, retirement_reason]

outcome_status:
  values:
    - Not Applicable
    - Not Yet Measurable
    - Measuring
    - Outcome Validated
    - Outcome Missed / Inconclusive
  transitions:
    - from: Not Yet Measurable
      to: Measuring
      authority: product_or_analytics_owner
      evidence: [measurement_started]
    - from: Measuring
      to: Outcome Validated
      authority: product_or_analytics_owner
      evidence: [outcome_record, sufficient_evidence]
    - from: Measuring
      to: Outcome Missed / Inconclusive
      authority: product_or_analytics_owner
      evidence: [outcome_record, result_and_decision]

blocked:
  representation: native_issue_dependency
  add_delivery_status: false

closure:
  # Two questions per route: what delivery state closure requires, and what
  # GitHub records as the reason. The audit reads this rather than carrying
  # its own list, so adding a route here is the whole change.
  completed:
    require_delivery_status: Output Done
    close_reason: completed
  not_planned:
    # Retired, abandoned, or decided against. It never reached Output Done and
    # must not be made to: requiring a delivery state the work did not earn is
    # how a board starts recording fiction.
    set_output_done: false
    close_reason: not_planned
  duplicate:
    # Superseded by another item, which carries the work. GitHub records this
    # natively, so the marking is the platform's rather than a label of ours.
    set_output_done: false
    close_reason: duplicate
