# Two deployment shapes, not a preference and a compromise. See ADR 0003.
#
#   project        fields live on one Projects v2 board scoped to the repository.
#                  Works for users and organizations. The default.
#   issue_fields   fields live on the organization and apply to every repository
#                  in it. Opt-in, for organizations wanting one shared
#                  vocabulary.
scope: project_scoped_default

backends:
  project:
    default: true
    # Exactly one board is authoritative. More than one candidate is an
    # ambiguity to refuse, never one to resolve by choosing.
    authoritative_project_count: 1
    field_value_addressing: option_id
  issue_fields:
    default: false
    requires: organization
    # GitHub rejects an option id here: values must be the option name.
    field_value_addressing: option_name
    note: >-
      Applies organization-wide. Adding a field for one repository adds it to
      every repository in the organization.

# Never, on either backend. A label is not an auditable field value.
allow_status_labels: false

issue_fields:
  Delivery Status:
    type: single_select
    values: [Inbox, Refining, Ready, In Progress, Output Done]
  Outcome Status:
    type: single_select
    values:
      - Not Applicable
      - Not Yet Measurable
      - Measuring
      - Outcome Validated
      - Outcome Missed / Inconclusive
  Priority:
    strategy: reuse_or_customize_existing_default
    do_not_create_duplicate: true
  Risk:
    type: single_select
    values: [Low, Medium, High]
  Severity:
    type: single_select
    values: [Critical, High, Medium, Low]
    applies_to: [Bug]
  Capability:
    strategy: organization_choice
    allowed_strategies: [text, bounded_single_select, area_labels]

native_metadata:
  - issue_type
  - assignee
  - parent_sub_issue
  - sub_issue_progress
  - issue_dependencies
  - linked_branch_pr
  - milestone

automation:
  prefer_github_app: true
  require_approved_plan_for_write: true
  require_read_back: true
  require_idempotency: true
  infer_output_done_from_closed_issue: false
  status_labels: disabled

# Retained for readers of earlier revisions: what was called a fallback is the
# `project` backend above, and it is now the default.
