evaluated_at: null
expires_at: null

roles:
  fast:
    primary: null
    fallbacks: []
  planner:
    primary: null
    fallbacks: []
    constraints: {high_reasoning: true}
  architect:
    primary: null
    fallbacks: []
    constraints: {high_reasoning: true}
  builder:
    primary: null
    fallbacks: []
  long_horizon_builder:
    primary: null
    fallbacks: []
    constraints: {long_running_agent_support: true}
  reviewer:
    primary: null
    fallbacks: []
    constraints:
      different_model_family_from: builder
      edit_permission: deny
  security:
    primary: null
    fallbacks: []
    constraints: {approved_for_security_context: true}

# Which providers a resolved model may come from. `require_approved_provider`
# was true with nothing to check against, so it approved everything.
approved_providers: []

resolution:
  require_approved_provider: true
  # How the installed inventory is read, per integration. Asking the CLI is
  # the only authority on whether a model id is real; a list maintained here
  # would be a second copy that drifts.
  #
  # Keyed by integration because there is no command that answers for both.
  # A single `opencode models` was declared for every project until the
  # greenfield pilot ran under `claude` and the one executable instruction in
  # this file could not run (#115).
  inventory_command:
    opencode: [opencode, models]
    # Claude Code has no inventory subcommand. Stated as null rather than
    # omitted: absent would read as an oversight, and a wrong command reads as
    # a capability. Neither is true, and a caller must be able to tell that
    # this integration cannot be asked.
    claude: null
  # Two different facts, kept apart. Collapsing them made routing impossible
  # under Claude Code by construction, and it was invisible only because
  # nothing takes the code path yet (#162).
  #
  # A command that exists and fails is an error: the inventory could have been
  # read and was not, so nothing is verified and the run refuses. Approving
  # every model because the call broke is how `require_approved_provider`
  # becomes decorative.
  unreadable_inventory: refuse
  # A command declared null is not an error. The integration says it cannot be
  # asked, which is a capability it does not have rather than a failure. Such
  # an integration does not route by role at all: its steps run on whatever
  # model the session already uses, and no id is verified because none is
  # chosen. Stated rather than silent, so a reader can tell that routing
  # governs OpenCode and not Claude Code.
  no_inventory_command: do_not_route
  # Where a resolved mapping is written. `record_resolved_mapping: true` above
  # described an intention with no destination.
  record_path: .specify/lifecycle/model-routing-resolved.yml
  # A resolution is only as current as its evaluation date. How long one stays
  # current is a decision somebody makes; recording refuses to invent it.
  expiry_required: true
  refresh_available_models: true
  record_resolved_mapping: true
