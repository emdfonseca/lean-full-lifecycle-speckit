[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lean-full-lifecycle-speckit"
version = "0.1.0"
description = "Spec Kit bundle source: Lean preset extended across the full product lifecycle."
requires-python = ">=3.11"

[tool.pytest.ini_options]
# scripts/ is importable so tests can use lib.inventory and the generators
# directly rather than shelling out to them.
pythonpath = [".", "scripts"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "requires_specify: needs the specify CLI on PATH",
    "requires_opencode: needs the opencode CLI on PATH",
    "sandbox: installs into a scratch project; slow",
    "req(id): the requirement id this test verifies (P1 traceability)",
    "wording: asserts a workflow's prose, not its behaviour; fails on deletion, not on regression",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
