[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lean-full-lifecycle-speckit"
version = "0.1.0"
description = "Spec Kit bundle source: Lean preset extended across the full product lifecycle."
requires-python = ">=3.11"

[tool.pytest.ini_options]
# scripts/ is importable so tests can use lib.inventory and the generators
# directly rather than shelling out to them.
pythonpath = [".", "scripts"]
testpaths = ["tests"]
# `-n auto --dist loadscope` runs the suite across one worker per core.
# `loadscope` rather than the default `load`: six sandbox modules hold a
# module-scoped catalog server open for their whole run, and splitting a module
# across workers would build one server per worker and cost more than the
# parallelism saves. Serially the suite takes 2:16; this brings it to ~30s.
# Use `-n0` to debug a failure with uninterleaved output.
addopts = "-ra --strict-markers -n auto --dist loadscope"
markers = [
    "requires_specify: needs the specify CLI on PATH",
    "requires_opencode: needs the opencode CLI on PATH",
    "sandbox: installs into a scratch project; slow",
    "req(id): the requirement id this test verifies (P1 traceability)",
    "wording: asserts a workflow's prose, not its behaviour; fails on deletion, not on regression",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

# Per-test contexts are what makes traceability measurable: the database records
# which test executed which line, so a requirement's cited tests can be asked
# whether they ran the component the requirement names.
[tool.coverage.run]
dynamic_context = "test_function"
branch = false
source = ["scripts", "bundle/components/extensions"]
# Tests drive scripts through subprocess.run because the refusal text is what a
# reader sees. Without this the parent process is measured and every check:
# component reads as never executed. See tooling/coverage-subprocess/.
parallel = true
