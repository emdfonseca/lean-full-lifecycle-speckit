schema_version: '1.0'
workflow:
  id: lifecycle-incident-hotfix
  name: Incident Hotfix
  version: 0.1.0
  author: Lean Full-Lifecycle Contributors
  description: Contain, remediate, verify, and reconcile an emergency production change.
requires:
  speckit_version: '>=1.0.1,<2.0.0'
inputs:
  integration:
    type: string
    default: auto
  issue_ref:
    type: string
    required: true
  incident:
    type: string
    required: true
  emergency_verdict:
    type: string
    default: ''
    enum: &id001
    - ''
    - approve
    - reject
  output_verdict:
    type: string
    default: ''
    enum: *id001
steps:
- id: create-incident-record
  timeout: 1800
  type: prompt
  integration: '{{ inputs.integration }}'
  prompt: 'Create .specify/lifecycle/incident-record.md for:

    {{ inputs.incident }}


    Record severity, incident commander, containment, affected scope,

    evidence, customer/security/privacy impact, minimum remediation,

    rollback, and emergency authority. Do not remediate yet.

    


Begin the file with a "What you are approving" block: one line per decision that needs a person''s judgement, each naming the section holding its evidence. Only decisions -- a baseline, a file inventory or a rollback procedure is a fact and does not belong there; a block naming everything names nothing. Where you label items for cross-reference, define them under that same label and under a heading, so searching for the label finds the definition and not only the references.'
- id: approve-emergency-change
  type: gate
  message: Review containment and emergency scope. Approve bounded remediation?
  options:
  - approve
  - reject
  on_reject: abort
  verdict_input: emergency_verdict
  show_file: .specify/lifecycle/incident-record.md
- id: transition-in-progress
  command: speckit.github-lifecycle.transition
  integration: '{{ inputs.integration }}'
  input:
    args: 'Apply approved transition for {{ inputs.issue_ref }}: Delivery Status → In Progress. --expect "Ready".'
- id: bounded-remediation
  timeout: 1800
  type: prompt
  integration: '{{ inputs.integration }}'
  prompt: 'Implement only the approved emergency remediation. Preserve an audit

    trail and add the smallest affected-path/regression evidence feasible.

    Do not perform unrelated cleanup or modernization.

    '
- id: verify
  type: shell
  run: .specify/lifecycle/verify
- id: converge
  timeout: 600
  command: speckit.converge
  integration: '{{ inputs.integration }}'
  input:
    args: Converge emergency implementation with intended containment and policy.
- id: write-delivery-record
  type: prompt
  timeout: 600
  integration: '{{ inputs.integration }}'
  prompt: 'Write the delivery record for {{ inputs.issue_ref }} to exactly .specify/lifecycle/delivery-record-{{
    context.run_id }}.md.

    Open with `## Decisions` naming what this gate decides: every judgement taken during
    the work that a reader could disagree with -- a scope that narrowed, a fix rejected
    for another, a risk accepted. One line each. If there were none, say so in one line;
    an empty heading is the failure this ordering exists to prevent.

    Then `## What was done`, `## What verification reported` (what the verify and converge
    steps actually said, not that they ran), and `## What this exposed` -- a correction to
    the item''s own text, a defect found, a thing that turned out harder than assumed.

    This is posted on the issue and is the record a later reader is told to trust over
    re-deriving the work, so write it for someone who was not here.'
- id: approve-output-done
  type: gate
  message: Review emergency verification and recovery. Approve Output Done?
  options:
  - approve
  - reject
  on_reject: abort
  verdict_input: output_verdict
  show_file: .specify/lifecycle/delivery-record-{{ context.run_id }}.md
- id: transition-output-done
  command: speckit.github-lifecycle.transition
  integration: '{{ inputs.integration }}'
  input:
    args: 'Apply approved transition for {{ inputs.issue_ref }}: Delivery Status → Output Done. --expect "In Progress". Post the approved record with --comment .specify/lifecycle/delivery-record-{{ context.run_id }}.md.'
- id: post-incident-reconciliation
  timeout: 300
  type: prompt
  integration: '{{ inputs.integration }}'
  prompt: 'Create post-incident follow-up: regression tests, spec reconciliation,

    temporary-access removal, root cause, communications, and deduplicated

    follow-up items with owners and dates.

    '
