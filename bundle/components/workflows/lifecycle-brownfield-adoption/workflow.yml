schema_version: '1.0'
workflow:
  id: lifecycle-brownfield-adoption
  name: Brownfield Adoption
  version: 0.1.0
  author: Lean Full-Lifecycle Contributors
  description: Adopt Spec Kit through scoped discovery, intent reconciliation, and a quality ratchet.
requires:
  speckit_version: '>=1.0.1,<2.0.0'
inputs:
  integration:
    type: string
    default: auto
  scope_mode:
    type: string
    default: scan
    enum:
    - scan
    - targeted
    prompt: 'scan reads and writes nothing outside .specify/; targeted changes code'
  target:
    type: string
    default: ''
    prompt: Bounded target, required when scope_mode is targeted
  known_intent:
    type: string
    default: ''
  verification_verdict:
    type: string
    default: ''
    enum:
    - ''
    - approve
    - reject
  adoption_verdict:
    type: string
    default: ''
    enum: &id001
    - ''
    - approve
    - reject
  discovery_verdict:
    type: string
    default: ''
    enum: *id001
steps:
- id: inspect-github
  command: speckit.github-lifecycle.inspect
  integration: '{{ inputs.integration }}'
  input:
    args: Inspect GitHub lifecycle metadata for brownfield adoption. Read-only.
- id: create-adoption-plan
  type: prompt
  integration: '{{ inputs.integration }}'
  prompt: 'Inspect the existing repository without broad cleanup or mutation.


    Target: {{ inputs.target }}

    Known intent: {{ inputs.known_intent }}


    Code/tests are evidence, not automatically intended behavior. Preserve

    working Devbox, package, build, CI, and deployment mechanisms.


    Create .specify/lifecycle/brownfield-adoption-plan.md containing current

    state, quality baseline, quality ratchet, scoped exceptions, bounded

    discovery scope, approvals, validation, and rollback.


    If Target is empty, plan framework adoption plus a shallow readiness

    scan only. Do not inventory the whole estate.

    '
- id: approve-adoption-plan
  type: gate
  message: Review .specify/lifecycle/brownfield-adoption-plan.md. Approve adoption?
  options:
  - approve
  - reject
  on_reject: abort
  verdict_input: adoption_verdict
  show_file: .specify/lifecycle/brownfield-adoption-plan.md
- id: establish-constitution
  command: speckit.constitution
  integration: '{{ inputs.integration }}'
  input:
    args: Apply Lean Full-Lifecycle governance with brownfield quality ratchet and scoped exceptions.
- id: scoped-discovery
  type: switch
  expression: '{{ inputs.scope_mode }}'
  cases:
    scan:
    - id: scan-state-the-restraint
      type: prompt
      integration: '{{ inputs.integration }}'
      prompt: 'This is a readiness scan of somebody else''s codebase. It reads.


        Say so before you start, and name the one thing that would make it not a scan:
        modifying any file outside .specify/. That includes formatting, a lint fix that
        looked free, and a dependency bump. Each is small, and each turns a scan somebody
        agreed to into a change they did not.'
    - id: scan-read-only-discovery
      type: prompt
      integration: '{{ inputs.integration }}'
      prompt: 'Perform the shallow readiness scan. Read only.


        Cite evidence. Reconcile current and intended behavior. Identify characterization
        and regression test gaps, seams, risk, observability, compatibility, migration,
        and rollback needs.


        Do not infer authoritative requirements from code alone.


        Write .specify/lifecycle/brownfield-discovery.md and an explicit readiness verdict.
        Recommend exactly one bounded first target: a scan that recommends five is a
        modernization backlog, which is the thing this workflow exists not to produce.'
    - id: scan-report-what-was-touched
      type: prompt
      integration: '{{ inputs.integration }}'
      prompt: 'State in the report that the run was read-only, and name every file written.


        Every one must be under .specify/. If any is not, say which and stop: the run
        did something other than what was approved, and reporting it as a scan would
        make the record wrong as well.'
    targeted:
    - id: targeted-apply-approved-scope
      type: prompt
      integration: '{{ inputs.integration }}'
      prompt: 'Apply approved framework-adoption changes, then perform only the approved
        discovery scope.


        Target: {{ inputs.target }}

        Known intent: {{ inputs.known_intent }}


        Cite evidence. Reconcile current and intended behavior. Identify characterization
        and regression tests, seams, risk, observability, compatibility, migration, and
        rollback needs.


        Do not infer authoritative requirements from code alone. Do not rewrite, mass-format,
        or upgrade unrelated dependencies. Each of those is a change nobody asked for
        arriving inside one they did.


        Write .specify/lifecycle/brownfield-discovery.md and an explicit readiness verdict.'
    - id: targeted-validate-exceptions
      command: speckit.github-lifecycle.exception
      integration: '{{ inputs.integration }}'
      input:
        args: 'Validate every exception this adoption relies on against exception-policy.yml.
          Stop on any refusal. An exception that is blanket, ownerless, or past its review
          date is how a codebase stops improving while every gate still reports green.'
- id: scan-evidence-for-sensitive-data
  command: speckit.github-lifecycle.sensitive
  integration: '{{ inputs.integration }}'
  input:
    args: 'Scan .specify/lifecycle/brownfield-discovery.md before anyone reviews it.
      Report the record and the field for every finding and never the value: a report
      that quotes the secret has copied it somewhere new. If patterns_from_policy is
      false the governance preset is not installed and a conservative fallback ran; say
      so rather than reporting the record clean.'
- id: redact-evidence-before-review
  command: speckit.github-lifecycle.sensitive
  integration: '{{ inputs.integration }}'
  input:
    args: 'Redact .specify/lifecycle/brownfield-discovery.md in place, using --redact
      with --out set to the same file. Run this only after the scan step above has
      reported. Report findings_before and findings_after and whether the file changed.
      Redaction is not authorization: a value that should never have been read is still
      a finding after the marker replaces it, so if findings_after is not zero say which
      fields remain and stop rather than sending the record to review.'
- id: review-discovery
  type: gate
  message: Review .specify/lifecycle/brownfield-discovery.md and its readiness verdict.
  options:
  - approve
  - reject
  on_reject: abort
  verdict_input: discovery_verdict
  show_file: .specify/lifecycle/brownfield-discovery.md
- id: check-verification-commands
  command: speckit.github-lifecycle.verify-bootstrap
  integration: '{{ inputs.integration }}'
  input:
    args: 'Check whether this project defines the verification commands the workflows
      run. Write the result to .specify/lifecycle/verification-commands-{{ context.run_id
      }}.md, reporting present, overlaid, and missing separately: a user acts differently
      on each, and "verification is not set up" tells them which command to add. Writes
      nothing else. If a command is missing, propose either a generated minimal script
      or an overlay, and stop at the gate before writing either.'
- id: approve-verification-resolution
  type: gate
  message: 'Approve how the missing verification commands are resolved. A generated script
    requires a recorded stack decision; an overlay may satisfy only a command the workflows
    actually run, and its project side is whatever this project already runs. Rejecting
    leaves the commands missing, and the first delivery will fail at a shell step.'
  options:
  - approve
  - reject
  on_reject: abort
  verdict_input: verification_verdict
  show_file: .specify/lifecycle/verification-commands-{{ context.run_id }}.md
- id: github-doctor
  command: speckit.github-lifecycle.doctor
  integration: '{{ inputs.integration }}'
  input:
    args: Read-only final lifecycle configuration check.
- id: validate-adoption
  type: prompt
  integration: '{{ inputs.integration }}'
  prompt: 'Validate actual state, quality ratchet, scoped exceptions, preserved

    build paths, and absence of unrelated changes.


    Write .specify/lifecycle/brownfield-adoption-report.md with exactly one

    next action.

    '
