schema_version: '1.0'
workflow:
  id: lifecycle-retirement
  name: Deprecation and Retirement
  version: 0.1.0
  author: Lean Full-Lifecycle Contributors
  description: Plan and deliver controlled deprecation, migration, shutdown, and evidence archival.
requires:
  speckit_version: '>=1.0.1,<2.0.0'
inputs:
  integration:
    type: string
    default: auto
  issue_ref:
    type: string
    required: true
  retirement_intent:
    type: string
    required: true
  plan_verdict:
    type: string
    default: ''
    enum: &id001
    - ''
    - approve
    - reject
  output_verdict:
    type: string
    default: ''
    enum: *id001
steps:
- id: specify-retirement
  timeout: 1800
  command: speckit.specify
  integration: '{{ inputs.integration }}'
  input:
    args: 'Deprecation/retirement: {{ inputs.retirement_intent }}. Source: {{ inputs.issue_ref }}'
- id: plan-retirement
  timeout: 1800
  command: speckit.plan
  integration: '{{ inputs.integration }}'
  input:
    args: Plan notice, replacement/migration, usage telemetry, support end, data export/retention/deletion, secret revocation,
      dependency removal, shutdown, archive, rollback, and verification.
- id: tasks
  timeout: 1800
  command: speckit.tasks
  integration: '{{ inputs.integration }}'
  input:
    args: Create phased, reversible retirement tasks with communication and verification.
- id: analyze
  timeout: 600
  command: speckit.analyze
  integration: '{{ inputs.integration }}'
  input:
    args: 'Analyze hidden dependencies, compatibility, retention/legal obligations,
      and rollback. Write the findings to exactly .specify/lifecycle/retirement-analysis-{{
      context.run_id }}.md, opening with a "What you are approving" block: one line per
      irreversible action this retirement performs and per dependency that would break,
      each naming the section holding its evidence. This is the file the approver is
      shown, so a consequence that is not in it is one nobody sees before it happens.'
- id: approve-retirement-plan
  type: gate
  message: Review retirement specification, dependencies, and irreversible actions.
  show_file: .specify/lifecycle/retirement-analysis-{{ context.run_id }}.md
  options:
  - approve
  - reject
  on_reject: abort
  verdict_input: plan_verdict
- id: transition-in-progress
  command: speckit.github-lifecycle.transition
  integration: '{{ inputs.integration }}'
  input:
    args: 'Apply approved transition for {{ inputs.issue_ref }}: Delivery Status → In Progress. --expect "Ready".'
- id: implement
  timeout: 1800
  command: speckit.implement
  integration: '{{ inputs.integration }}'
  input:
    args: '{{ inputs.retirement_intent }}'
- id: verify
  type: shell
  run: devbox run verify
- id: converge
  timeout: 600
  command: speckit.converge
  integration: '{{ inputs.integration }}'
  input:
    args: Verify retirement intent, migrations, hidden dependencies, and archival.
- id: write-delivery-record
  type: prompt
  timeout: 600
  integration: '{{ inputs.integration }}'
  prompt: 'Write the delivery record for {{ inputs.issue_ref }} to exactly .specify/lifecycle/delivery-record-{{
    context.run_id }}.md.

    Open with `## Decisions` naming what this gate decides: every judgement taken during
    the work that a reader could disagree with -- a scope that narrowed, a fix rejected
    for another, a risk accepted. One line each. If there were none, say so in one line;
    an empty heading is the failure this ordering exists to prevent.

    Then `## What was done`, `## What verification reported` (what the verify and converge
    steps actually said, not that they ran), and `## What this exposed` -- a correction to
    the item''s own text, a defect found, a thing that turned out harder than assumed.

    This is posted on the issue and is the record a later reader is told to trust over
    re-deriving the work, so write it for someone who was not here.'
- id: approve-output-done
  type: gate
  message: Review retirement verification. Approve Output Done?
  options:
  - approve
  - reject
  on_reject: abort
  verdict_input: output_verdict
  show_file: .specify/lifecycle/delivery-record-{{ context.run_id }}.md
- id: transition-output-done
  command: speckit.github-lifecycle.transition
  integration: '{{ inputs.integration }}'
  input:
    args: 'Apply approved transition for {{ inputs.issue_ref }}: Delivery Status → Output Done. --expect "In Progress". Post the approved record with --comment .specify/lifecycle/delivery-record-{{ context.run_id }}.md.'
