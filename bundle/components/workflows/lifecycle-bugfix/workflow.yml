schema_version: '1.0'
workflow:
  id: lifecycle-bugfix
  name: Bugfix
  version: 0.1.0
  author: Lean Full-Lifecycle Contributors
  description: Reproduce, regression-specify, fix, verify, converge, and close a bounded defect.
requires:
  speckit_version: '>=1.0.1,<2.0.0'
inputs:
  integration:
    type: string
    default: auto
  issue_ref:
    type: string
    required: true
  bug:
    type: string
    required: true
  assessment_verdict:
    type: string
    default: ''
    enum: &id001
    - ''
    - approve
    - reject
  output_verdict:
    type: string
    default: ''
    enum: *id001
steps:
- id: assess-bug
  timeout: 600
  type: prompt
  integration: '{{ inputs.integration }}'
  prompt: 'Assess issue {{ inputs.issue_ref }}: {{ inputs.bug }}


    Reproduce from evidence, identify intended behavior and relevant spec,

    classify severity/security implications, and define the smallest failing

    regression test. Identify characterization tests for risky legacy

    behavior. Write .specify/lifecycle/bugfix-assessment-{{ context.run_id }}.md. Do not fix yet.

    


Begin the file with a "What you are approving" block: one line per decision that needs a person''s judgement, each naming the section holding its evidence. Only decisions -- a baseline, a file inventory or a rollback procedure is a fact and does not belong there; a block naming everything names nothing. Where you label items for cross-reference, define them under that same label and under a heading, so searching for the label finds the definition and not only the references.'
- id: approve-assessment
  type: gate
  message: Review reproduction, intended behavior, and regression-test plan.
  options:
  - approve
  - reject
  on_reject: abort
  verdict_input: assessment_verdict
  show_file: .specify/lifecycle/bugfix-assessment-{{ context.run_id }}.md
- id: transition-in-progress
  command: speckit.github-lifecycle.transition
  integration: '{{ inputs.integration }}'
  input:
    args: 'Apply approved transition for {{ inputs.issue_ref }}: Delivery Status → In Progress. --expect "Ready".'
- id: specify-bugfix
  timeout: 1800
  command: speckit.specify
  integration: '{{ inputs.integration }}'
  input:
    args: 'Bugfix: {{ inputs.bug }}. Reconcile an existing authoritative capability spec when appropriate; otherwise create
      the smallest durable behavioral contract. Source: {{ inputs.issue_ref }}'
- id: plan
  timeout: 1800
  command: speckit.plan
  integration: '{{ inputs.integration }}'
  input:
    args: Create the smallest safe bugfix plan; avoid unrelated cleanup.
- id: tasks
  timeout: 1800
  command: speckit.tasks
  integration: '{{ inputs.integration }}'
  input:
    args: Order regression/characterization tests before minimum fix and refactor.
- id: analyze
  timeout: 1800
  command: speckit.analyze
  integration: '{{ inputs.integration }}'
  input:
    args: Check minimal scope, regression evidence, spec impact, and brownfield ratchet.
- id: implement
  timeout: 1800
  command: speckit.implement
  integration: '{{ inputs.integration }}'
  input:
    args: '{{ inputs.bug }}'
- id: verify
  type: shell
  run: devbox run verify
- id: check-quality-ratchet
  command: speckit.github-lifecycle.ratchet
  integration: '{{ inputs.integration }}'
  input:
    args: 'Run the ratchet for every gate quality-gates.yml declares ratcheted, with
      the number this verification produced, --produced-by naming the commit, and --conditions
      naming what that number covered. A run that states no conditions is refused, because
      a baseline of one scope cannot be compared with a measurement of another. Report
      baseline_established as a baseline and never as a pass: a first run that reports
      a pass makes every later comparison meaningless. On a refusal, report the gate,
      the baseline, and the measurement, and do not re-run hoping for a different number.'
- id: converge
  timeout: 1800
  command: speckit.converge
  integration: '{{ inputs.integration }}'
  input:
    args: Verify intended bug behavior and absence of unrelated divergence.
- id: write-delivery-record
  type: prompt
  timeout: 600
  integration: '{{ inputs.integration }}'
  prompt: 'Write the delivery record for {{ inputs.issue_ref }} to exactly .specify/lifecycle/delivery-record-{{
    context.run_id }}.md.

    Open with `## Decisions` naming what this gate decides: every judgement taken during
    the work that a reader could disagree with -- a scope that narrowed, a fix rejected
    for another, a risk accepted. One line each. If there were none, say so in one line;
    an empty heading is the failure this ordering exists to prevent.

    Then `## What was done`, `## What verification reported` (what the verify and converge
    steps actually said, not that they ran), and `## What this exposed` -- a correction to
    the item''s own text, a defect found, a thing that turned out harder than assumed.

    This is posted on the issue and is the record a later reader is told to trust over
    re-deriving the work, so write it for someone who was not here.'
- id: approve-output-done
  type: gate
  message: Review regression evidence and convergence. Approve Output Done?
  options:
  - approve
  - reject
  on_reject: abort
  verdict_input: output_verdict
  show_file: .specify/lifecycle/delivery-record-{{ context.run_id }}.md
- id: transition-output-done
  command: speckit.github-lifecycle.transition
  integration: '{{ inputs.integration }}'
  input:
    args: 'Apply approved transition for {{ inputs.issue_ref }}: Delivery Status → Output Done; read back. --expect "In Progress". Post the approved record with --comment .specify/lifecycle/delivery-record-{{ context.run_id }}.md.'
