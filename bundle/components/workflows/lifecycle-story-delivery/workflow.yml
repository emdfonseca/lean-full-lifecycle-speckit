schema_version: '1.0'
workflow:
  id: lifecycle-story-delivery
  name: Story Delivery
  version: 0.1.0
  author: Lean Full-Lifecycle Contributors
  description: Run a bounded Story through core Spec Kit, verification, convergence, and Output Done.
requires:
  speckit_version: '>=1.0.1,<2.0.0'
inputs:
  integration:
    type: string
    default: auto
  issue_ref:
    type: string
    required: true
  intent:
    type: string
    required: true
  technical_finding:
    type: string
    default: none
    enum:
    - none
    - capture
  technical_finding_verdict:
    type: string
    default: ''
    enum:
    - ''
    - approve
    - reject
  readiness_verdict:
    type: string
    default: ''
    enum:
    - ''
    - approve
    - reject
  work_verdict:
    type: string
    default: ''
    enum:
    - ''
    - approve
    - reject
  output_verdict:
    type: string
    default: ''
    enum:
    - ''
    - approve
    - reject
  uncertainty_mode:
    type: string
    default: none
    enum:
    - none
    - discovery
    - prototype
    - spike
    - threat-analysis
  uncertainty_verdict:
    type: string
    default: ''
    enum:
    - ''
    - approve
    - reject
steps:
- id: confirm-readiness
  command: speckit.github-lifecycle.readiness
  integration: '{{ inputs.integration }}'
  input:
    args: >-
      Read the readiness verdict recorded for {{ inputs.issue_ref }} with
      --from-record and the issue number, validate it, and emit it to
      .specify/lifecycle/readiness-{{ context.run_id }}.md so the gate can show
      it. Do not assess readiness again: lifecycle-refine already made this
      judgement and it was validated there, and a second unvalidated opinion is
      how the item most likely to be wrong gets two chances to pass.

      Stop if no verdict was recorded. An item that reached delivery without
      passing refine is exactly what this catches, and an absent verdict is not
      a passing one.

- id: approve-readiness
  type: gate
  message: Review readiness. Continue only when the item is Ready.
  options:
  - approve
  - reject
  on_reject: abort
  verdict_input: readiness_verdict
  show_file: .specify/lifecycle/readiness-{{ context.run_id }}.md
- id: transition-in-progress
  command: speckit.github-lifecycle.transition
  integration: '{{ inputs.integration }}'
  input:
    args: 'Apply approved transition for {{ inputs.issue_ref }}: Delivery Status → In Progress; read back.
      --expect "Ready".'
- id: specify
  produces: spec.md
  timeout: 1800
  command: speckit.specify
  integration: '{{ inputs.integration }}'
  input:
    args: '{{ inputs.intent }} Source issue: {{ inputs.issue_ref }}'
- id: resolve-uncertainty
  type: switch
  expression: '{{ inputs.uncertainty_mode }}'
  cases:
    none: []
    discovery:
    - id: uncertainty-discovery-scope
      timeout: 600
      type: prompt
      integration: '{{ inputs.integration }}'
      prompt: 'State the boundary for discovering what {{ inputs.issue_ref }} needs, before looking at
        anything.



        Write .specify/lifecycle/discovery-scope-{{ context.run_id }}.md saying what you will examine
        and what you will deliberately not.


Begin the file with a "What you are approving" block: one line per decision that needs a person''s judgement, each naming the section holding its evidence. Only decisions -- a baseline, a file inventory or a rollback procedure is a fact and does not belong there; a block naming everything names nothing. Where you label items for cross-reference, define them under that same label and under a heading, so searching for the label finds the definition and not only the references.'
    - id: uncertainty-discovery-investigate
      timeout: 600
      type: prompt
      integration: '{{ inputs.integration }}'
      prompt: 'Investigate within that scope. Read only.



        Write .specify/lifecycle/discovery-{{ context.run_id }}.md with every section the schema requires.
        Mark each behaviour observation specified or inferred; which of the two matters more than the
        observation.'
    - id: uncertainty-discovery-validate
      command: speckit.github-lifecycle.discover
      integration: '{{ inputs.integration }}'
      input:
        args: Validate .specify/lifecycle/discovery-{{ context.run_id }}.md. Stop on any blocking finding.
    - id: uncertainty-discovery-approve
      type: gate
      integration: '{{ inputs.integration }}'
      verdict_input: uncertainty_verdict
      show_file: .specify/lifecycle/discovery-{{ context.run_id }}.md
      on_reject: abort
      options:
      - approve
      - reject
      message: 'Accept this record as evidence. It is not a specification: nothing here becomes intended
        behaviour until reconciled.'
    prototype:
    - id: uncertainty-prototype-questions
      timeout: 300
      type: prompt
      integration: '{{ inputs.integration }}'
      prompt: 'State what this prototype must answer for {{ inputs.issue_ref }}, before building anything.



        Write .specify/lifecycle/prototype-questions-{{ context.run_id }}.md naming the journeys you will
        implement and the ones you will not. Use fake or local data; production credentials and production
        data are out of scope.'
    - id: uncertainty-prototype-build
      timeout: 1800
      type: prompt
      integration: '{{ inputs.integration }}'
      prompt: 'Build only enough to answer the stated questions. Use the real design system where practical,
        so what you learn is about the interaction rather than the scaffolding.



        Stop when the questions are answered.'
    - id: uncertainty-prototype-disposal
      timeout: 300
      type: prompt
      integration: '{{ inputs.integration }}'
      prompt: 'Write .specify/lifecycle/disposal/{{ inputs.issue_ref }}-{{ context.run_id }}.md with kind,
        questions, findings, decision, and artifacts.



        Record what you learned, not what you built. "unresolved" is a legitimate finding. Choose delete,
        archive, or promote; promotion requires an approver and a reason.'
    - id: uncertainty-prototype-validate
      command: speckit.github-lifecycle.disposal
      integration: '{{ inputs.integration }}'
      input:
        args: Validate .specify/lifecycle/disposal/{{ inputs.issue_ref }}-{{ context.run_id }}.md. Stop
          on any blocking finding.
    - id: uncertainty-prototype-approve
      type: gate
      integration: '{{ inputs.integration }}'
      verdict_input: uncertainty_verdict
      show_file: .specify/lifecycle/disposal/{{ inputs.issue_ref }}-{{ context.run_id }}.md
      on_reject: abort
      options:
      - approve
      - reject
      message: Approve this disposal. Promotion carries the artifacts into production and is the decision
        the ephemeral classification exists to make deliberate.
    spike:
    - id: uncertainty-spike-bound
      timeout: 300
      type: prompt
      integration: '{{ inputs.integration }}'
      prompt: 'Bound this spike for {{ inputs.issue_ref }} before starting.



        Write .specify/lifecycle/spike-scope-{{ context.run_id }}.md stating the question, permitted scope,
        required evidence, time box, and exit criteria. The exit criteria must include the case where
        the answer invalidates the work that prompted it.'
    - id: uncertainty-spike-investigate
      timeout: 300
      type: prompt
      integration: '{{ inputs.integration }}'
      prompt: 'Investigate within the stated scope and time box.



        Stop at the time box whether or not you have an answer. An expired spike with a partial answer
        is a result; one that quietly ran long has destroyed its own boundary.'
    - id: uncertainty-spike-disposal
      timeout: 300
      type: prompt
      integration: '{{ inputs.integration }}'
      prompt: Write .specify/lifecycle/disposal/{{ inputs.issue_ref }}-{{ context.run_id }}.md with kind,
        question, permitted_scope, required_evidence, time_box, exit_criteria, questions, findings, decision,
        and artifacts.
    - id: uncertainty-spike-validate
      command: speckit.github-lifecycle.disposal
      integration: '{{ inputs.integration }}'
      input:
        args: Validate .specify/lifecycle/disposal/{{ inputs.issue_ref }}-{{ context.run_id }}.md. Stop
          on any blocking finding.
    - id: uncertainty-spike-approve
      type: gate
      integration: '{{ inputs.integration }}'
      verdict_input: uncertainty_verdict
      show_file: .specify/lifecycle/disposal/{{ inputs.issue_ref }}-{{ context.run_id }}.md
      on_reject: abort
      options:
      - approve
      - reject
      message: Approve this disposal. Anything the spike produced is ephemeral until this says otherwise.
    threat-analysis:
    - id: uncertainty-threat-model
      timeout: 300
      type: prompt
      integration: '{{ inputs.integration }}'
      prompt: 'Analyse the threats {{ inputs.issue_ref }} introduces or changes.



        Write .specify/lifecycle/threat-{{ context.run_id }}.md naming the assets, the trust boundaries
        this change moves, the inputs an attacker controls, the abuse cases, and the controls required.



        Name the negative verification each control needs. A control nobody tested for absence is an assumption.


Begin the file with a "What you are approving" block: one line per decision that needs a person''s judgement, each naming the section holding its evidence. Only decisions -- a baseline, a file inventory or a rollback procedure is a fact and does not belong there; a block naming everything names nothing. Where you label items for cross-reference, define them under that same label and under a heading, so searching for the label finds the definition and not only the references.'
    - id: uncertainty-threat-approve
      type: gate
      integration: '{{ inputs.integration }}'
      verdict_input: uncertainty_verdict
      show_file: .specify/lifecycle/threat-{{ context.run_id }}.md
      on_reject: abort
      options:
      - approve
      - reject
      message: Accept this threat analysis. Rejecting stops the run rather than proceeding with the risk
        unexamined.
  default: []
- id: reconcile-what-was-learned
  type: switch
  expression: '{{ inputs.uncertainty_mode }}'
  cases:
    none: []
  default:
  - id: reconcile-spec
    timeout: 600
    type: prompt
    integration: '{{ inputs.integration }}'
    prompt: 'Reconcile what was learned with the spec for {{ inputs.issue_ref }} before planning.



      Every inferred observation is either confirmed against the spec or recorded as still unconfirmed.
      An unconfirmed observation must not be written as an acceptance criterion: it is evidence, and evidence
      is not intent.



      This step runs only when a mode other than none was declared, so something was
      always learned. Reconcile it or record it as unconfirmed; skipping silently is how
      a guess becomes a requirement.'
- id: plan
  produces: plan.md
  timeout: 1800
  command: speckit.plan
  integration: '{{ inputs.integration }}'
  input:
    args: '{{ inputs.intent }}'
- id: checklist
  produces: checklists/
  timeout: 1800
  command: speckit.checklist
  integration: '{{ inputs.integration }}'
  input:
    args: Create only risk-appropriate product, security, migration, operability, and accessibility checks.
- id: tasks
  produces: tasks.md
  timeout: 1800
  command: speckit.tasks
  integration: '{{ inputs.integration }}'
  input:
    args: '{{ inputs.intent }}'
- id: analyze
  timeout: 600
  command: speckit.analyze
  integration: '{{ inputs.integration }}'
  input:
    args: 'Analyze spec, plan, tasks, Constitution, risk controls, and safe parallelism.
      Write the findings, by severity and naming the authoritative artifact to correct,
      to exactly .specify/lifecycle/analysis-{{ context.run_id }}.md. This is the file
      the reviewer is shown, so a finding that is not in it is a finding nobody sees.'
- id: review-work
  type: gate
  message: 'Review the analysis of spec, plan, and tasks together: acceptance criteria
    without evidence, constitution or risk violations, missing TDD ordering, unsafe
    parallelism. Rejecting stops before any code is written.'
  options:
  - approve
  - reject
  on_reject: abort
  verdict_input: work_verdict
  show_file: .specify/lifecycle/analysis-{{ context.run_id }}.md
- id: implement
  timeout: 1800
  command: speckit.implement
  integration: '{{ inputs.integration }}'
  input:
    args: '{{ inputs.intent }}'
- id: verify
  type: shell
  run: devbox run verify
- id: check-quality-ratchet
  command: speckit.github-lifecycle.ratchet
  integration: '{{ inputs.integration }}'
  input:
    args: 'Run the ratchet for every gate quality-gates.yml declares ratcheted, with
      the number this verification produced, --produced-by naming the commit, and --conditions
      naming what that number covered. A run that states no conditions is refused, because
      a baseline of one scope cannot be compared with a measurement of another. Report
      baseline_established as a baseline and never as a pass: a first run that reports
      a pass makes every later comparison meaningless. On a refusal, report the gate,
      the baseline, and the measurement, and do not re-run hoping for a different number.'
- id: capture-a-technical-finding
  type: switch
  expression: '{{ inputs.technical_finding }}'
  cases:
    capture:
    - id: search-for-a-technical-finding
      command: speckit.github-lifecycle.capture
      integration: '{{ inputs.integration }}'
      input:
        args: 'Delivery exposes technical findings that are not this story: a latent
          defect the change revealed, a constraint the plan assumed and the code
          contradicted, a dependency that cannot hold. Search the backlog for anything
          already covering what this delivery exposed, closed items included, and
          report every candidate with its score.

          Read-only: create nothing on GitHub. Write the report to exactly
          .specify/lifecycle/finding-candidates-{{ context.run_id }}.md, opening with
          a "What you are approving" line: whether to file this as new work, given the
          candidates below. Then every candidate with its score, title and state, and
          the one sentence saying why it does or does not already cover this.'
    - id: approve-the-technical-finding
      type: gate
      integration: '{{ inputs.integration }}'
      verdict_input: technical_finding_verdict
      on_reject: abort
      options:
      - approve
      - reject
      show_file: .specify/lifecycle/finding-candidates-{{ context.run_id }}.md
      message: 'Create this finding? The candidate duplicates reported above are what
        you are deciding against, closed ones included. Reject if one already covers
        it: a second issue for a known problem makes the backlog less trustworthy,
        not more complete.'
    - id: capture-the-technical-finding
      command: speckit.github-lifecycle.capture
      integration: '{{ inputs.integration }}'
      input:
        args: 'Create the approved finding with --found-in {{ inputs.issue_ref }},
          so the story it came from links to it and it links back. Meet the type''s
          content contract, and name every candidate the search raised with
          --considered so the duplicate decision is recorded rather than bypassed.
          State what was observed and where; a finding from delivery is evidence,
          not a diagnosis, so do not write a cause the work did not establish.'
    none: []
  default: []
- id: converge
  timeout: 600
  command: speckit.converge
  integration: '{{ inputs.integration }}'
  input:
    args: Converge implementation, spec, tasks, Constitution, and Output Done evidence.
- id: record-lineage
  command: speckit.github-lifecycle.lineage
  integration: '{{ inputs.integration }}'
  input:
    args: >-
      Record what {{ inputs.issue_ref }} was derived from: run `record` with the
      issue number, this run's feature directory, and --workflow lifecycle-story-delivery.
      After converge and before the delivery record, so what is hashed is what
      the item was actually built against.

      Do not pass a list of artifacts. The workflow's own `produces`
      declarations say what to hash, which is why adding a producing step
      extends lineage with nothing to change here.
- id: write-delivery-record
  type: prompt
  timeout: 600
  integration: '{{ inputs.integration }}'
  prompt: 'Write the delivery record for {{ inputs.issue_ref }} to exactly .specify/lifecycle/delivery-record-{{
    context.run_id }}.md.

    Open with `## Decisions` naming what this gate decides: every judgement taken during
    the build that a reader could disagree with -- a scope that narrowed, a criterion
    dropped, an approach rejected. One line each. If there were none, say so in one line;
    an empty heading is the failure this ordering exists to prevent.

    Then `## What was built`, `## What verification reported` (what the verify, ratchet
    and converge steps actually said, not that they ran), and `## What this exposed`
    -- a correction to the item''s own text, a defect found, a thing that turned out
    harder than the item assumed.

    This is posted on the issue and is the record a later reader is told to trust over
    re-deriving the work, so write it for someone who was not here. Do not restate the
    acceptance criteria back; say whether they held.'
- id: approve-output-done
  type: gate
  message: 'Review the delivery record against the verification and convergence output.
    Approving posts it on the issue and moves the item to Output Done.'
  options:
  - approve
  - reject
  on_reject: abort
  verdict_input: output_verdict
  show_file: .specify/lifecycle/delivery-record-{{ context.run_id }}.md
- id: transition-output-done
  command: speckit.github-lifecycle.transition
  integration: '{{ inputs.integration }}'
  input:
    args: 'Apply approved transition for {{ inputs.issue_ref }}: Delivery Status → Output Done; close
      only if authorized; read back. --expect "In Progress". Pass --uncertainty-mode {{ inputs.uncertainty_mode
      }} so a prototype run cannot complete without a disposal record whatever the item
      is labelled. Post the approved record with --comment .specify/lifecycle/delivery-record-{{
      context.run_id }}.md.'
