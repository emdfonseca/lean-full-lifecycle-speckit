schema_version: '1.0'
workflow:
  id: lifecycle-refine
  name: Refine to Ready
  version: 0.1.0
  author: Lean Full-Lifecycle Contributors
  description: Take one item from Refining to Ready through an evidenced readiness verdict.
requires:
  speckit_version: '>=1.0.1,<2.0.0'
inputs:
  integration:
    type: string
    default: auto
  issue_ref:
    type: string
    required: true
  readiness_verdict:
    type: string
    default: ''
    enum:
      - ''
      - approve
      - reject
  transition_verdict:
    type: string
    default: ''
    enum:
      - ''
      - approve
      - reject
steps:
  - id: inspect-item
    command: speckit.github-lifecycle.inspect
    integration: '{{ inputs.integration }}'
    input:
      args: >-
        Inspect {{ inputs.issue_ref }} and the lifecycle configuration. Read-only.
        Report the backend selected and whether the target is usable. Stop if it is not.

  - id: assess-readiness
    timeout: 600
    type: prompt
    integration: '{{ inputs.integration }}'
    prompt: >-
      Assess whether {{ inputs.issue_ref }} is ready to be worked.


      Read the item and the content contract for its type in
      policy/item-types.yml. Judge only what is written: an item is not ready
      because you can guess what was meant.


      Write .specify/lifecycle/readiness-{{ context.run_id }}.md containing a
      fenced yaml verdict with readiness, blocking_questions, risk, spec_impact,
      material_uncertainty, and next_engineering_action.


      List a blocking question for anything a reader would have to ask before
      starting. An empty list is a claim that nobody would need to ask
      anything. Technical design is not a prerequisite; not knowing what
      "done" means is.



      Begin the file with a "What you are approving" block: one line per decision
      that needs a person's judgement, each naming the section holding its
      evidence. Only decisions -- a baseline, a file inventory or a rollback
      procedure is a fact and does not belong there; a block naming everything
      names nothing. Where you label items for cross-reference, define them under
      that same label and under a heading, so searching for the label finds the
      definition and not only the references.
  - id: validate-readiness
    command: speckit.github-lifecycle.readiness
    integration: '{{ inputs.integration }}'
    input:
      args: >-
        Validate .specify/lifecycle/readiness-{{ context.run_id }}.md against the
        schema and lint the acceptance criteria of {{ inputs.issue_ref }}.
        Report blocking findings separately from advisory ones. Stop on any
        blocking finding; the item stays in Refining.

  - id: approve-readiness
    type: gate
    integration: '{{ inputs.integration }}'
    verdict_input: readiness_verdict
    show_file: .specify/lifecycle/readiness-{{ context.run_id }}.md
    on_reject: abort
    options:
      - approve
      - reject
    message: >-
      Approve moving this item to Ready on this verdict. Rejecting leaves it in
      Refining, which is the correct outcome when a question is still open.

  - id: transition-ready
    command: speckit.github-lifecycle.transition
    integration: '{{ inputs.integration }}'
    input:
      args: >-
        Apply approved transition for {{ inputs.issue_ref }}: Delivery Status →
        Ready; read back. --expect "Refining". Assert the
        evidence the plan requires. Report the value before and after.
