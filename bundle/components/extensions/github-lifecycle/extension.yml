schema_version: '1.0'
extension:
  id: github-lifecycle
  name: GitHub Lifecycle
  version: 0.1.0
  description: Plan and apply audited GitHub Issue Field lifecycle operations.
  author: Lean Full-Lifecycle Contributors
  repository: https://github.com/YOUR-ORG/lean-full-lifecycle-speckit
  license: MIT
  homepage: https://github.com/YOUR-ORG/lean-full-lifecycle-speckit
  category: integration
  effect: read-write
requires:
  speckit_version: '>=1.0.1,<2.0.0'
  tools:
  - name: gh
    required: true
  - name: python3
    required: true
  # Optional, and the cost of its absence is stated rather than silent:
  # transition_plan.py catches OSError and SubprocessError from `git diff` and
  # returns None, so the audit reports one fewer rule rather than failing.
  # Declaring it required: true would fail installs that work.
  - name: git
    required: false
    why: >-
      transition_plan.py runs `git -C <root> diff --name-only HEAD` to compare
      the board against the working tree. Without it the audit's
      working_tree_disagreement rule cannot run; every other rule still does.
  # What the shipped scripts need of the interpreter that runs them. Declared
  # because nothing did: 23 of 31 import yaml, and a greenfield pilot resolved
  # `{SCRIPT}` to a `python3` without it, so every command reading policy died
  # at import (#132). `python_min` is the floor the scripts actually hold to,
  # verified by importing all 31 under it.
  python_min: '3.9'
  python_packages:
  - name: PyYAML
    import_name: yaml
    required: true
    why: >-
      Every policy file is YAML, and reading policy is what these scripts do.
  # Optional, and the cost of its absence is stated rather than silent: the
  # four scripts that use it catch ImportError and report "jsonschema is not
  # installed; schema not enforced". A readiness verdict still gets its other
  # checks; it does not get its schema checked.
  - name: jsonschema
    import_name: jsonschema
    required: false
    why: >-
      Validates a readiness verdict, outcome record, discovery note, and
      disposal decision against its declared schema. Without it those four are
      accepted on shape alone.
provides:
  commands:
  - name: speckit.github-lifecycle.inspect
    file: commands/inspect.md
    tier: project-setup
    description: Bootstrap, once — inspect GitHub lifecycle configuration without mutation.
  - name: speckit.github-lifecycle.board
    file: commands/board.md
    tier: project-setup
    description: Bootstrap, once — create the Projects v2 board a project-scoped deployment needs.
  - name: speckit.github-lifecycle.elicit
    file: commands/elicit.md
    tier: project-setup
    description: Bootstrap, once — interview the person whose answers the product documents encode.
  - name: speckit.github-lifecycle.documents
    file: commands/documents.md
    tier: project-setup
    description: Bootstrap, once — write and check the core documents a bootstrapped project must have.
  - name: speckit.github-lifecycle.plan
    file: commands/plan.md
    tier: policy-validator
    description: Workflows, not people — create a read-only plan for GitHub lifecycle changes.
  - name: speckit.github-lifecycle.transition
    file: commands/transition.md
    tier: per-item
    description: Drivers and workflows — apply one approved lifecycle transition and read it back.
  - name: speckit.github-lifecycle.capture
    file: commands/capture.md
    tier: per-item
    description: Drivers and workflows — deduplicate and create an approved backlog finding.
  - name: speckit.github-lifecycle.link
    file: commands/link.md
    tier: per-item
    description: Drivers and workflows — manage approved issue hierarchy and dependency links.
  - name: speckit.github-lifecycle.readiness
    file: commands/readiness.md
    tier: per-item
    description: Drivers and workflows — validate a readiness verdict before an item may become Ready.
  - name: speckit.github-lifecycle.decompose
    file: commands/decompose.md
    tier: per-item
    description: Drivers and workflows — report an Epic's decomposition horizon and create approved children.
  - name: speckit.github-lifecycle.retire
    file: commands/retire.md
    tier: per-item
    description: Drivers and workflows — retire a Story that will not be delivered, or supersede one another carries.
  - name: speckit.github-lifecycle.restructure
    file: commands/restructure.md
    tier: per-item
    description: Drivers and workflows — split a Story too large to start, or merge two that turned out to be one.
  - name: speckit.github-lifecycle.triage
    file: commands/triage.md
    tier: per-item
    description: Drivers and workflows — assess an incoming item and propose what happens to it next.
  - name: speckit.github-lifecycle.risk
    file: commands/risk.md
    tier: policy-validator
    description: Workflows, not people — score a change's risk from policy and name the controls it requires.
  - name: speckit.github-lifecycle.discover
    file: commands/discover.md
    tier: policy-validator
    description: Workflows, not people — validate a bounded discovery record.
  - name: speckit.github-lifecycle.disposal
    file: commands/disposal.md
    tier: policy-validator
    description: Workflows, not people — validate the disposal decision for a prototype or spike.
  - name: speckit.github-lifecycle.claude-config
    file: commands/claude-config.md
    tier: project-setup
    description: Bootstrap, once — generate Claude Code settings from policy, and report what does not map.
  - name: speckit.github-lifecycle.opencode-config
    file: commands/opencode-config.md
    tier: project-setup
    description: Bootstrap, once — generate the OpenCode configuration from policy, and report what it cannot enforce.
  - name: speckit.github-lifecycle.opencode-layout
    file: commands/opencode-layout.md
    tier: project-setup
    description: Bootstrap, once — detect which OpenCode layout a project uses before writing near it.
  - name: speckit.github-lifecycle.models
    file: commands/models.md
    tier: project-setup
    description: Bootstrap, once — verify every role's model against the installed OpenCode inventory.
  - name: speckit.github-lifecycle.ratchet
    file: commands/ratchet.md
    tier: policy-validator
    description: Workflows, not people — hold each measurable gate to the best it has ever done.
  - name: speckit.github-lifecycle.sensitive
    file: commands/sensitive.md
    tier: policy-validator
    description: Workflows, not people — refuse unauthorized production data, and keep credentials out of framework evidence.
  - name: speckit.github-lifecycle.exception
    file: commands/exception.md
    tier: policy-validator
    description: Workflows, not people — validate an exception against the exception policy.
  - name: speckit.github-lifecycle.verify-bootstrap
    file: commands/verify-bootstrap.md
    tier: project-setup
    description: Bootstrap, once — check that the project defines the verification commands the workflows run.
  - name: speckit.github-lifecycle.mismatch
    file: commands/mismatch.md
    tier: project-setup
    description: Bootstrap, once — decide whether a repository already contains a product before greenfield bootstrap writes anything.
  - name: speckit.github-lifecycle.outcome
    file: commands/outcome.md
    tier: policy-validator
    description: Workflows, not people — assess an outcome record and recommend a status.
  - name: speckit.github-lifecycle.doctor
    file: commands/doctor.md
    tier: project-setup
    description: Bootstrap, once — run read-only GitHub lifecycle diagnostics.
  - name: speckit.github-lifecycle.status
    file: commands/status.md
    tier: driver
    description: Yours to run — report what is true in this project and what is startable, in one read-only pass.
  - name: speckit.github-lifecycle.lineage
    file: commands/lineage.md
    tier: per-item
    description: Drivers and workflows — record what an item was derived from, and detect a spec changed out of band.
  config:
  - name: github-lifecycle-config.yml
    template: config-template.yml
tags:
- github
- integration
- issues
- lifecycle
- backlog
