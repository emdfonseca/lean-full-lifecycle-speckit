schema_version: '1.0'
extension:
  id: github-lifecycle
  name: GitHub Lifecycle
  version: 0.1.0
  description: Plan and apply audited GitHub Issue Field lifecycle operations.
  author: Lean Full-Lifecycle Contributors
  repository: https://github.com/YOUR-ORG/lean-full-lifecycle-speckit
  license: MIT
  homepage: https://github.com/YOUR-ORG/lean-full-lifecycle-speckit
  category: integration
  effect: read-write
requires:
  speckit_version: '>=1.0.1,<2.0.0'
  tools:
  - name: gh
    required: true
  # Every command in this extension invokes a Python script. Declaring it is
  # the honest alternative to shipping shell variants: `transition_plan.py`
  # alone does schema validation, read-back verification, and dependency
  # resolution, and a second implementation in shell would be one nobody tests.
  - name: python3
    required: true
provides:
  commands:
  - name: speckit.github-lifecycle.inspect
    file: commands/inspect.md
    description: Inspect GitHub lifecycle configuration without mutation.
  - name: speckit.github-lifecycle.plan
    file: commands/plan.md
    description: Create a read-only plan for GitHub lifecycle changes.
  - name: speckit.github-lifecycle.transition
    file: commands/transition.md
    description: Apply one approved lifecycle transition and read it back.
  - name: speckit.github-lifecycle.capture
    file: commands/capture.md
    description: Deduplicate and create an approved backlog finding.
  - name: speckit.github-lifecycle.link
    file: commands/link.md
    description: Manage approved issue hierarchy and dependency links.
  - name: speckit.github-lifecycle.readiness
    file: commands/readiness.md
    description: Validate a readiness verdict before an item may become Ready.
  - name: speckit.github-lifecycle.decompose
    file: commands/decompose.md
    description: Report an Epic's decomposition horizon and create approved children.
  - name: speckit.github-lifecycle.triage
    file: commands/triage.md
    description: Assess an incoming item and propose what happens to it next.
  - name: speckit.github-lifecycle.discover
    file: commands/discover.md
    description: Validate a bounded discovery record.
  - name: speckit.github-lifecycle.disposal
    file: commands/disposal.md
    description: Validate the disposal decision for a prototype or spike.
  - name: speckit.github-lifecycle.claude-config
    file: commands/claude-config.md
    description: Generate Claude Code settings from policy, and report what does not map.
  - name: speckit.github-lifecycle.opencode-config
    file: commands/opencode-config.md
    description: Generate the OpenCode configuration from policy, and report what it cannot enforce.
  - name: speckit.github-lifecycle.opencode-layout
    file: commands/opencode-layout.md
    description: Detect which OpenCode layout a project uses before writing near it.
  - name: speckit.github-lifecycle.models
    file: commands/models.md
    description: Verify every role's model against the installed OpenCode inventory.
  - name: speckit.github-lifecycle.ratchet
    file: commands/ratchet.md
    description: Hold each measurable gate to the best it has ever done.
  - name: speckit.github-lifecycle.sensitive
    file: commands/sensitive.md
    description: Refuse unauthorized production data, and keep credentials out of framework evidence.
  - name: speckit.github-lifecycle.exception
    file: commands/exception.md
    description: Validate an exception against the exception policy.
  - name: speckit.github-lifecycle.verify-bootstrap
    file: commands/verify-bootstrap.md
    description: Check at bootstrap that the project defines the verification commands the workflows run.
  - name: speckit.github-lifecycle.mismatch
    file: commands/mismatch.md
    description: Decide whether a repository already contains a product before greenfield bootstrap writes anything.
  - name: speckit.github-lifecycle.outcome
    file: commands/outcome.md
    description: Assess an outcome record and recommend a status.
  - name: speckit.github-lifecycle.doctor
    file: commands/doctor.md
    description: Run read-only GitHub lifecycle diagnostics.
  config:
  - name: github-lifecycle-config.yml
    template: config-template.yml
tags:
- github
- integration
- issues
- lifecycle
- backlog
