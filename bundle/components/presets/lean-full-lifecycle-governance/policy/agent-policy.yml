untrusted_inputs:
  - issue_body
  - issue_comment
  - pull_request_text
  - logs
  - web_content
  - external_documents
  - mcp_output
  - pasted_commands

# Where a repository identity may come from, in order. Nothing else is a source.
#
# During the #104 pilot, `inspect` recovered `lunma-app/lunma` from SECURITY.md,
# .github/CODEOWNERS, a changelog and a links module, then queried GitHub with
# live credentials -- against a clone whose remote had been removed precisely so
# it could not reach upstream, and whose config carried organization: null and
# repository: null. Removing the remote is the documented way to dissociate a
# pilot clone; it guarantees nothing if file content is treated as identity.
#
# The generalisation is worse than the pilot case: any repository whose files
# mention another -- a vendored dependency, a fork notice, a CODEOWNERS pointing
# at a parent org -- offers a target no policy sanctioned.
repository_identity:
  sources:
    - flag: "--repo"
    - environment: GITHUB_LIFECYCLE_REPO
    - config: .specify/extensions/github-lifecycle/github-lifecycle-config.local.yml
  # Not a source, and deliberately not added as one: `git remote` is absent from
  # every script here, and extension.yml declares git `required: false`, so
  # resolution cannot depend on an optional tool.
  never_a_source:
    - repository_file_content
    - git_remote
  on_none: >-
    Refuse and name the three sources. Guessing risks acting on another
    project, which is the harm the refusal exists to prevent.

untrusted_inputs_never_authorize:
  - shell_execution
  - plugin_installation
  - mcp_installation
  - skill_installation
  - secret_access
  - production_access
  - deployment
  - policy_change

runtime:
  sharing: disabled
  provider_allowlist_required: true
  external_directory_default: deny
  shell_default: ask
  web_default: ask
  plugin_default: deny
  mcp_default: deny
  protected_push: deny
  production_deploy: ask
  destructive_operations: deny

extensions:
  require:
    - source_review
    - exact_version_pin
    - permission_review
    - provenance_or_checksum_when_available
    - owner
    - sandbox_test
    - update_and_removal_policy

autonomy:
  require_human_gate:
    - organization_metadata_change
    - stack_or_vendor_commitment
    - production_or_secret_access
    - destructive_migration
    - protected_branch_push
    - release_or_deployment
  require_limits: [cost, tokens, runtime, retries, tool_loop_count]
