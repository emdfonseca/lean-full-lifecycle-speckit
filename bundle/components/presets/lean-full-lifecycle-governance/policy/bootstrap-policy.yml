# What must be true before a bootstrap writes anything.
#
# Greenfield bootstrap assumes an empty repository. Run against a real
# codebase it scaffolds over somebody's product, which is destructive and easy
# to miss until later. This file states how "already has a product" is decided.

mismatch:
  # The question is intent, and the roadmap is explicit that counts cannot
  # answer it: a repository of forty config files is empty, and one with a
  # single domain module is not. So classification is by path and kind, and a
  # count never appears in a verdict.
  decides_on: named_files
  counts_never_decide: true

  # Scaffolding whatever it contains. A directory here is scaffolding all the
  # way down.
  scaffolding_paths:
    - .git/**
    - .github/**
    - .specify/**
    - .devbox/**
    - .venv/**
    - node_modules/**
    - vendor/**
    - dist/**
    - build/**
    - docs/**
    - .vscode/**
    - .idea/**

  # Scaffolding by name, wherever they sit. These are how a project is
  # configured, not what it does.
  scaffolding_files:
    - README.md
    - LICENSE
    - CONTRIBUTING.md
    - .gitignore
    - .editorconfig
    - .env.example
    - Makefile
    - Dockerfile
    - docker-compose.yml
    - devbox.json
    - devbox.lock
    - pyproject.toml
    - setup.py
    - setup.cfg
    - conftest.py
    - noxfile.py
    - tox.ini
    - package.json
    - package-lock.json
    - tsconfig.json
    - vite.config.ts
    - webpack.config.js
    - go.mod
    - go.sum
    - Cargo.toml
    - Cargo.lock
    - pom.xml
    - build.gradle

  # A file with one of these suffixes, outside the scaffolding above, carries
  # application or domain logic.
  code_suffixes:
    - .py
    - .ts
    - .tsx
    - .js
    - .jsx
    - .go
    - .rs
    - .java
    - .kt
    - .rb
    - .cs
    - .php
    - .swift
    - .scala
    - .ex
    - .exs

  # Configuration written in a programming language. The suffix says code and
  # the name says configuration; the name wins.
  configuration_suffixes:
    - .config.js
    - .config.ts
    - .config.mjs
    - .rc.js

  # Tests count as application code. A test suite is evidence of a product to
  # test, and treating it as scaffolding is how a repository with a full suite
  # and one thin module reads as empty.
  tests_are_application_code: true

  on_unreadable:
    # A repository that cannot be enumerated must not come back as empty. Here
    # the safe-looking default is the destructive one.
    verdict: blocked
    reason: >-
      The repository could not be read. Absent evidence is not evidence of an
      empty repository, and greenfield bootstrap writes.

  handoff:
    to: lifecycle-brownfield-adoption
    requires_human_gate: true

verification_commands:
  # The only two shell commands the framework permits, and the whole shell
  # surface of the bundle: five workflow steps run the first and one runs the
  # second.
  #
  # These are paths, not commands. The framework owns the path; the project
  # owns what is behind it. Until #166 they read `devbox run verify` and
  # `devbox run release-verify`, which made a third-party binary a prerequisite
  # for running five of the fourteen workflows. #104's pilot target is a pnpm
  # monorepo whose verification works, is documented and runs in CI, and the
  # framework reported it as missing verification because the name did not
  # match.
  #
  # The conflation that caused it: an environment manager and a task runner are
  # not the same role. Devbox provisions a toolchain; pnpm, make, just, cargo
  # and plain shell scripts run tasks, and a project can use one for each.
  # `framework.yml`'s `manager: devbox` stays, because that describes this
  # repository, which does use devbox. The defect was imposing it on adopted
  # projects.
  required:
    - .specify/lifecycle/verify
  release:
    - .specify/lifecycle/release-verify

  # How the file behind an entry point comes to exist.
  #
  # There is no `definition_source` and deliberately no discovery. Reading
  # devbox.json to find a `verify` script is what named the vendor, and adding
  # package.json beside it would reproduce the defect for every project using
  # make, just or cargo. A longer list of files to sniff is still a list of
  # vendors; the project states its gates instead, and this is generated from
  # what it stated.
  entry_point:
    generated_from: gate_resolution
    # One line per gate whose outcome is `resolved`, in the order
    # quality-gates.yml declares them, each naming the gate it runs so a
    # failure can be read back to a gate by a person.
    #
    # The step is one step, not one per gate: `specify` has a `fan-out` step
    # type that would run a nested template per gate, and it was not chosen.
    # The cost is recorded rather than hidden -- a failure names the set, and
    # the runner cannot tell you which gate failed. The comments in the
    # generated file are what a person reads instead.
    one_line_per: resolved_gate
    names_the_gate: true
    # A gate that is `declined` or `filed` contributes no line. Filing work is
    # not doing it, and a declined gate is a decision, so neither is a hole in
    # the file -- but a project whose gates are all declined generates an entry
    # point that verifies nothing, and verify-bootstrap reports that rather
    # than reporting the file present.
    excludes: [declined, filed]

    # Both declared entry points are generated, from the same resolved set.
    #
    # Generating only `required` leaves `release` missing, so `detect` still
    # reports an entry point absent, the bootstrap report still names an
    # unresolved blocker, and the run cannot reach `completed` -- which is what
    # generation was added to fix (#192).
    #
    # They share one set because nothing here marks a gate release-only.
    # `sbom_provenance_signing` looks like the exception and is not: its
    # `when:` names properties of a change, not of a release, and a `when:` is
    # never evaluated at bootstrap because there is no change to evaluate it
    # against. Splitting the set would mean inventing a release policy. Each
    # generated file says so in its header, so a project adding release-only
    # gates knows what it is adding them to.
    covers: [required, release]

    # Every resolved gate contributes a line, conditional ones included, and
    # the condition goes in that line's comment. A conditional gate whose
    # command was recorded is a gate the project resolved; dropping it here
    # would silently narrow verification to the `always` set, and the comment
    # is what lets a person reading a slow verify see which lines are
    # conditional.
    conditional_gates: comment_the_condition

    # What the generated file does when no gate resolved to a command.
    #
    # A file that exits 0 having run nothing is a green verification step over
    # no gates. That is worse than a missing file: a missing one fails the
    # shell step loudly, and this one passes and is read downstream as
    # verified.
    when_empty:
      exit_nonzero: true
      says_why: true

  # Where each declared gate's outcome is recorded on a project. One entry per
  # gate quality-gates.yml declares. A gate with no entry is reported
  # unexamined, which is a finding rather than a silence.
  gate_resolution:
    file: .specify/lifecycle/gate-resolution.yml
    # Each outcome, the one field it must carry, and that field's type. An
    # outcome word with no content is the failure this record exists to end:
    # a `declined` carrying no reason is indistinguishable from a gate nobody
    # looked at.
    outcomes:
      resolved:
        field: command
        type: str
      declined:
        field: reason
        type: str
      filed:
        field: item
        type: int
    # `filed` names the backlog item created for a gate and leaves the gate
    # unresolved until that item is delivered. Recording a filing is not
    # resolving the gate, and a project whose gates are all filed has decided
    # nothing yet.
    leaves_unresolved: [filed]
    # A gate the owner wants becomes a proposed item first, so a run collects
    # every filing and puts them to a person as one batch. Filings stay data
    # until that person acts, which is what lets a refused creation resume.
    pending_filings_are: story

  # One resolution, where there were two. The overlay is gone: #144 established
  # it was inert -- `load_overlay` needed a `mappings` list the proposed shape
  # never produced, and Spec Kit's ShellStep runs `config["run"]` verbatim with
  # no reference to an overlay anywhere. Nothing was ever promoted because there
  # was nothing to promote.
  #
  # It also no longer has a job. An overlay existed to map a framework command
  # onto whatever the project actually ran, and the entry point does that
  # directly: the path is the framework's and the contents are the project's.
  resolution:
    - generate_entry_point_when_stack_decided

  generation:
    # The entry point has to run something, and what to run is a stack
    # decision. Generating one without it means inventing the project's
    # toolchain and calling it a default.
    requires_stack_decision: true
    # Each source names the section that records the decision, because a file
    # existing is not a decision. The check tested only that one of these was
    # non-empty, and every bootstrap writes a constitution, so the guard
    # against inventing a toolchain was cleared by the document that was meant
    # to contain the answer (#136).
    #
    # The constitution stays a source: a real one records its tooling choices,
    # and the brownfield pilot's does, under this heading.
    stack_decision_sources:
      - path: .specify/lifecycle/stack-decision.md
        records_decision_in: Decision
      - path: .specify/memory/constitution.md
        records_decision_in: Recorded stack decisions

# Where an agent integration keeps its project files. Declared rather than
# hardcoded, because these are somebody else's paths and they move.
integrations:
  opencode:
    folder: .opencode
    # Spec Kit writes commands to the current directory and reads the legacy
    # one. Both are live: a project initialized by an older CLI has the second,
    # and writing into the wrong one produces a project where the commands are
    # present and the agent cannot see them.
    commands_dirs:
      current: .opencode/commands
      legacy: .opencode/command
    config_files:
      - opencode.json
      - opencode.jsonc
    command_layout: file_per_command
    command_name_separator: "."

    # agent-policy runtime rule -> the OpenCode config key that expresses it.
    # Declared here because it is a claim about somebody else's schema, and a
    # claim like that belongs where it can be reviewed against their docs.
    permission_mapping:
      shell_default: permission.bash
      web_default: permission.webfetch
      external_directory_default: permission.external_directory
      sharing: share

    # Rules with no primitive of their own, expressible only as bash patterns.
    # A pattern is a weaker instrument than a permission key -- it matches
    # commands, not intents -- so each names what it is trying to catch.
    bash_pattern_rules:
      protected_push:
        patterns: ["git push --force*", "git push -f*", "git push * main*",
                   "git push * master*", "git push * release*"]
      production_deploy:
        patterns: ["kubectl apply*", "terraform apply*", "*deploy prod*"]
      destructive_operations:
        patterns: ["rm -rf*", "git reset --hard*", "git clean -fd*",
                   "*drop database*", "*drop table*"]

    # Rules OpenCode cannot express at all. Named so the generator can report
    # them rather than emit a config that looks stricter than it is.
    unenforceable:
      plugin_default:
        why: >-
          OpenCode has no plugin permission key. The config carries a `plugin`
          allowlist, which decides what loads, not what is refused.
        compensated_by: >-
          The generated config declares an exact plugin list, and the policy
          already requires source review and an exact version pin before any
          extension is added.
      mcp_default:
        why: >-
          OpenCode has no MCP permission key. `mcp` is a map of servers with an
          `enabled` flag each, so an unlisted server is absent rather than
          denied.
        compensated_by: >-
          The generated config declares the MCP servers explicitly, and
          agent-policy already forbids untrusted input from authorizing an MCP
          installation.
      provider_allowlist_required:
        why: >-
          OpenCode does not restrict which provider a model may come from.
        compensated_by: >-
          The models command refuses a model outside `approved_providers`
          before a config is ever generated.
      cost_and_runtime_limits:
        why: >-
          The config schema has no cost, token, or runtime ceiling. `maxSteps`
          bounds a loop; it does not bound spend.
        compensated_by: >-
          Nothing in the configuration. This one is a genuine gap and is
          reported as such rather than compensated.

  claude:
    folder: .claude
    commands_dirs:
      current: .claude/skills
    config_files:
      - .claude/settings.json
    # Claude Code writes a directory per command, each holding a SKILL.md,
    # where OpenCode writes one file per command. Same idea, different shape.
    command_layout: directory_per_command
    # Claude Code flattens `speckit.github-lifecycle.refine` to
    # `speckit-github-lifecycle-refine`; OpenCode keeps the dots. The layouts
    # differ in naming as well as in shape.
    command_name_separator: "-"

    # Its permission model is shaped differently from OpenCode's: rule strings
    # sorted into allow/deny/ask lists plus a default mode, rather than a key
    # per capability. So the mapping is per rule, not per key.
    permission_mapping:
      web_default:
        rules: [WebFetch, WebSearch]
      protected_push:
        rules: ["Bash(git push:*)"]
      production_deploy:
        rules: ["Bash(kubectl apply:*)", "Bash(terraform apply:*)"]
      destructive_operations:
        rules: ["Bash(rm -rf:*)", "Bash(git reset --hard:*)",
                "Bash(git clean:*)"]

    # Rules Claude Code expresses outside the permission lists.
    settings_mapping:
      # No key, and none needed: Claude Code confines itself to the project
      # directory unless additionalDirectories names others. Declaring none is
      # the denial.
      external_directory_default:
        key: additionalDirectories
        value_when_deny: []
      # Better than OpenCode, which had no primitive for either of these.
      mcp_default:
        key: enableAllProjectMcpServers
        value_when_deny: false
      plugin_default:
        key: enabledPlugins
        value_when_deny: {}
      shell_default:
        key: permissions.defaultMode
        value_when_ask: default

    unenforceable:
      sharing:
        why: >-
          Claude Code has no session-sharing setting to disable, because it has
          no session sharing to enable.
        compensated_by: >-
          Nothing is needed. The rule describes a capability this agent does
          not have.
      provider_allowlist_required:
        why: >-
          Claude Code does not select a model provider, so there is no provider
          to restrict.
        compensated_by: >-
          Nothing is needed. The rule applies to integrations that route
          between providers.
      cost_and_runtime_limits:
        why: >-
          Settings carry no cost, token, or runtime ceiling.
        compensated_by: >-
          Nothing in the configuration. This one is a genuine gap and is
          reported as such rather than compensated.
      secret_file_read_via_subprocess:
        why: >-
          A `Read` deny covers Claude Code's own file tools and the file
          commands it recognises in Bash, which is the boundary that does the
          work. It does not cover a subprocess that opens the file itself --
          `python -c "print(open('.env').read())"` reads a denied path through
          an interpreter no permission list enumerates. Naming readers was
          tried and removed (#135): four names denied four spellings of an
          operation the shell offers a dozen ways, and the next reader not on
          the list still passed.
        compensated_by: >-
          Nothing in the configuration. Closing it needs an OS-level sandbox
          confining the process rather than the command, which this bundle does
          not configure. Reported as an open gap rather than approximated.
      edit_permission:
        why: >-
          Claude Code has no per-agent edit permission. Permissions are the
          agent's to enforce, and settings.json carries no key that denies one
          role the writing tools while granting them to another. A curated tool
          list is not that key: it decides what an agent is offered, not what it
          is refused, and Bash alone can write anything the shell can reach.
        compensated_by: >-
          Nothing in the configuration. The reviewer role's denial rests on the
          review gate in agent-policy.yml, not on the generated settings, and is
          reported here so the config is not read as enforcing it.

# `specify init --script py|sh` records the project's choice in
# .specify/init-options.json, and Spec Kit installs both flavours of its own
# scripts regardless. This extension provides one, and says so rather than
# shipping a shell reimplementation that would drift from the tested copy.
script_flavours:
  provided: [py]
  project_choice_file: .specify/init-options.json
  project_choice_key: script
  on_mismatch: >-
    Report it. The scripts are installed and run wherever python3 is
    available; what a mismatch means is that this project asked for shell and
    nothing here honours that, which the operator should learn before a
    command fails rather than during one.

# How long a step may take, by the kind of work it does.
#
# Every step ran on the runner's 300s default until a real product context made
# the greenfield bootstrap plan exceed it (#116). The workflow passed its own
# harness, where the context was empty and there was nothing to synthesise, and
# failed on first real use.
#
# Not a blanket increase. A long default hides a genuinely hung step behind a
# long wait, which is the opposite failure and harder to notice. These name the
# steps whose duration scales with the input, and leave everything else short.
step_timeouts:
  # Named tiers. Every prompt step declares one of these values, because
  # guessing a step's cost from its id does not work: the first attempt keyed
  # on `create-` and the very next step, `apply-greenfield-bootstrap`, timed
  # out (#117). An author choosing a tier is reliable; a check inferring one
  # from a name is not.
  #
  # Builds a whole artifact from a product context or a codebase: a spec, a
  # plan, a task breakdown, an implementation, a bootstrap, an apply phase.
  artifact_synthesis: 1800
  # Reads and reports. Duration depends on the repository, not on how much
  # reasoning was asked for.
  inspection: 600
  # States something, records a decision, or names what happens next. Short by
  # construction.
  statement: 300

# What a bootstrap must ask before it writes the documents.
#
# `product_documents` below declares seven documents that state a project's
# direction and constraints. Until this block existed, the only product input
# to all seven was `product_context`: one string, prompted as "Product idea and
# constraints". Four gates guarded the run and every one of them was
# approve/reject on content already written, which is worse than no gate: a
# person who approved an artifact reads it afterwards as agreed, and downstream
# work treats it as the project's stated intent (#186).
#
# Recording an open question is not asking it. A real greenfield run produced a
# constitution of eighteen principles, a domain of thirteen terms, and a
# decision log holding three unrecovered product questions plus D1-D5 marked
# `Open`. The generator correctly recorded what it did not know and had no
# mechanism to ask.
#
# `/speckit.clarify` is not the instrument, and the reason is recorded here
# because it is the question anyone reading this asks first. It is a
# feature-spec command: its first step runs `check-prerequisites.sh`, which at
# bootstrap time fails with "Feature directory not found", and its own
# instructions say to abort there. It reads `FEATURE_SPEC`, scans that spec, and
# writes answers back under `## Clarifications` in it. Bootstrap has no feature,
# no branch and no spec. That is why none of the fourteen workflows call it, and
# it is not an oversight in this one. Its question-quality rules are good and
# are lifted into `form` below rather than re-derived.
product_elicitation:

  # The workflows that must elicit before they write. Named rather than
  # inferred from whether a workflow calls the documents command: inferring
  # would sweep in `lifecycle-brownfield-adoption`, whose unknowns are
  # recovered from a codebase rather than asked, and would answer by accident a
  # question nobody has decided. Inferring a rule from a name was tried in
  # `step_timeouts` above and did not hold.
  required_in:
    - lifecycle-greenfield-bootstrap

  # Elicitation runs before the step that chooses the stack, draws the product
  # boundary, and creates the Epic set. Placing it at the document-writing step
  # instead would be later, simpler, and would leave those three derived from
  # the one paragraph this whole block exists to replace.
  runs_before:
    step: apply-greenfield-bootstrap
    because: >-
      That step selects a stack, draws a product boundary, and creates the Epic
      set. An answer that arrives after it is an answer to a question already
      decided.

  # How the interview is conducted. These are rules about the asking, not about
  # the answers, and they are what separates an interview from a form.
  form:
    ordered: >-
      Questions run in the order declared, and the order is one where each
      question is answerable given the ones before it. Intent before users,
      users before constraints, constraints before done. A question asked out
      of order is one the person cannot answer yet.
    one_at_a_time: >-
      Ask exactly one question, wait, then ask the next. Never show the queue
      in advance: a person answering the second question has not seen the
      seventh, and seeing it changes the second answer.
    prefer_closed: >-
      Where the plausible answers can be listed, ask a closed question -- two to
      five mutually exclusive options as a table, with one named as the
      recommendation and one line saying why. The common case is then a single
      keystroke. This should be most of the interview.
    open_only_when_options_would_invent: >-
      Ask an open question only where offering options would mean inventing the
      product. Intent and domain vocabulary are the two: a list of candidate
      intents is a list of guesses about somebody else's product.
    derivation_never_skips_a_question: >-
      Where the product context already implies an answer, that does not remove
      the question. It turns an open question into a closed one whose
      recommended option is the derived value, quoting the span it came from.
      Every question reaches the person; derivation only makes it cheaper to
      answer. A question skipped because the answer seemed obvious is today's
      behaviour with an extra step.
    answers_condition_what_follows: >-
      Later questions are built from earlier answers, and a question an earlier
      answer has already settled is dropped -- visibly, recorded as settled by
      the answer that settled it, not silently.
    question_writing: >-
      Each question is a full interrogative ending in `?`, answerable by
      somebody who has never read this contract. Never a topic label or a
      section name. Follow it with one plain sentence saying what the answer
      changes.

  # Nothing here blocks the run.
  #
  # Blocking on a question nobody can answer yet would make greenfield
  # unusable, which is the failure this must not trade for. What is guaranteed
  # is that the question was asked and that silence stays visible -- not that an
  # answer exists.
  decline:
    allowed: true
    blocks_the_run: false
    records:
      - >-
        An entry in the answer record with `status: declined` and a reason. A
        decline with no reason is indistinguishable from a question nobody
        reached.
      - >-
        A line under `Open` in .specify/lifecycle/product-decisions.md, which
        the document contract already requires.
      - >-
        In the section that would have used the answer: a sentence naming the
        question as unanswered. Never a value. An invented answer is worse than
        an absent one, because the next reader believes it.
      - >-
        A line in the bootstrap report's `Unresolved blockers:` list, so
        `accept-the-bootstrap-report` shows a person the total rather than one
        decline at a time.

  # Where the answers live, and why they outlive the run that collected them.
  #
  # Keyed by project, not by run. A readiness verdict was keyed by run once and
  # a second, unvalidated one got made because the first could not be named --
  # the note under `## One judgement per item` in the readiness command records
  # that. The same shape would fail the same way here.
  record:
    path: .specify/lifecycle/product-answers.yml
    fields:
      asked_on:
        type: date
        required: true
        note: >-
          When the interview ran. Evidence of when the answers were true, which
          is what lets a later contradiction be dated.
      answers:
        type: list
        required: true
        note: One entry per declared question, in declared order, none omitted.
    per_answer:
      id:
        type: string
        required: true
        note: The declared question id. Stable, and what a document cites.
      status:
        type: enum
        values: [answered, declined, settled_by]
        required: true
      answer:
        type: string
        required_when: answered
      reason:
        type: string
        required_when: declined
        note: Why it could not be answered. Not what the answer might be.
      settled_by:
        type: string
        required_when: settled_by
        note: >-
          The id of the earlier answer that already settled this one. Records
          why a declared question was not asked.
      basis:
        type: enum
        values: [typed, accepted_recommendation]
        required_when: answered
        note: >-
          Whether the person wrote the answer or accepted the offered one. Both
          are answers; the distinction is what tells a later reader how much
          weight the recommendation carried.

  # A document section that encodes an answer cites its id, so a later
  # contradiction traces to the answer rather than to the paragraph that
  # encoded it. `[Q3]` at the end of the sentence or the table row.
  citation:
    marker: '[<question id>]'
    required_in_sections_fed_by_a_question: true

  # The questions. Each names the document sections its answer feeds, so the
  # set cannot drift from `product_documents` without one of them naming a
  # section the other does not have.
  #
  # `form` is the default shape. `prefer_closed` above can still turn an open
  # question closed once the product context implies an answer; it can never
  # turn a closed question open.
  questions:
    - id: Q1
      ask: What does this product do, and for whom?
      form: open
      changes: The one paragraph every other document is written against.
      feeds:
        - {document: PRODUCT.md, section: Intent}

    - id: Q2
      ask: Which kinds of people use it, and what does each use it for?
      form: closed
      changes: Who the acceptance criteria are written for.
      feeds:
        - {document: PRODUCT.md, section: Users}

    - id: Q3
      ask: What must be observably true for this to be correct?
      form: closed
      changes: >-
        What Output Done is checked against. Without it the gate has nothing to
        read.
      feeds:
        - {document: PRODUCT.md, section: Definition of done}

    - id: Q4
      ask: What would a reasonable reader expect this to do that it will not?
      form: closed
      changes: >-
        What later work is refused without re-arguing it. An empty answer is a
        claim that nothing is out of scope.
      feeds:
        - {document: PRODUCT.md, section: Non-goals}

    - id: Q5
      ask: What must this product hold to that is not your choice?
      form: closed
      changes: >-
        Which constraints bind the architecture. A binding constraint found
        after the stack is chosen is a rewrite.
      feeds:
        - {document: PRODUCT.md, section: Constraints}

    - id: Q6
      ask: What should this be built with?
      form: closed
      changes: >-
        The stack, and everything it forecloses. Also whether a verification
        command can be generated at all -- `verification_commands.generation`
        above refuses to invent a toolchain without this decision.
      feeds:
        - {document: .specify/lifecycle/stack-decision.md, section: Decision}
        - {document: .specify/lifecycle/stack-decision.md, section: Consequences}

    - id: Q7
      ask: Where does this run, and how is a release undone?
      form: closed
      changes: >-
        The runbook, and whether a rollback exists. An irreversible step is
        named here or it is discovered during an incident.
      feeds:
        - {document: .specify/lifecycle/runbook.md, section: Running it}
        - {document: .specify/lifecycle/runbook.md, section: Rollback}

    - id: Q8
      ask: Where would you look first when it breaks?
      form: closed
      changes: >-
        Whether the observability section is a list of URLs or a description of
        what normal looks like.
      feeds:
        - {document: .specify/lifecycle/runbook.md, section: Observability}

    - id: Q9
      ask: >-
        Which words does your product use that mean something different here
        than they usually do?
      form: open
      changes: >-
        Whether the next reader takes a term to mean what it means everywhere
        else. Options cannot be offered: a list of candidate terms is a list of
        guesses about somebody else's domain.
      feeds:
        - {document: .specify/lifecycle/domain.md, section: Vocabulary}

    - id: Q10
      ask: What will deliberately not be tested, and why not?
      form: closed
      changes: >-
        Whether the same argument recurs every release. An empty answer is a
        claim that everything is tested.
      feeds:
        - {document: PRODUCT.md, section: Deliberately untested}

    - id: Q11
      ask: Which single outcome should the first Epic deliver?
      form: closed
      changes: >-
        The backlog `apply-greenfield-bootstrap` creates, and which Epic gets
        decomposed into the first Ready queue.
      feeds:
        - {document: .specify/lifecycle/product-decisions.md, section: Open}

# The documents a bootstrapped project must have, whichever route it took.
#
# Greenfield and brownfield produce the same set with the same sections. The
# difference is only what can be filled in: a new project's building blocks are
# intended, an adopted project's are observed. One contract, because a reader
# moving between two projects should not have to learn two shapes (#126).
#
# Section names follow established formats rather than invented ones. The first
# version of this contract invented all of them, including a decision-record
# shape for a project that already had five Nygard ADRs in docs/decisions/.
#
#   architecture   arc42, tailored. https://arc42.org -- CC BY-SA 4.0, and the
#                  template states it is tailorable. Five of its twelve
#                  sections are used; §9 Architectural Decisions is delegated
#                  to ADRs, which arc42 permits explicitly.
#   decisions      Nygard ADR: Status, Context, Decision, Consequences. The
#                  format docs/decisions/ already uses and the
#                  documentation-and-adrs skill already writes.
#   constitution   RFC 2119 keywords. Already in use; now required.
#
# C4 is deliberately not used: it is a diagramming methodology, not a
# documentation template, so it names levels of abstraction rather than
# sections. Its vocabulary may still be used inside the building-block view.
#
# Length is not budgeted. A line count is wrong for somebody -- the first
# attempt set a constitution at 200 lines, which would have meant deleting
# principles from a real one. Form is checked instead and scales on its own.
product_documents:
  style:
    - >-
      Answer the section's question and stop. A section that says more than its
      question asked has taken room from one that says less.
    - >-
      Facts go in tables, one row each, one line per row. Prose is for the one
      thing a table cannot hold: why.
    - >-
      State the decision, not the reasoning that reached it. Reasoning belongs
      in the decision record, where it is dated and attributable.
    - No document summarises itself, and no section restates another.
    - >-
      Where something could not be recovered, say so. An invented answer is
      worse than an absent one, because the next reader believes it.

  # Every declared document carries this line, directly under its title.
  # Nothing here made a stale document visible, so one that stopped being true
  # looked exactly like one that is (#137). The date is evidence of when the
  # claim was last checked, which the style rules permit as an exception to
  # "docs are state, not history"; the change id says what checked it.
  freshness:
    line: 'Last verified: <YYYY-MM-DD> (change: <change-id>)'
    required: true
    # A stamp nobody can contradict is worse than no stamp.
    refuse_future_dates: true

  # Where the project already keeps its decision records.
  #
  # This was named in prose as docs/decisions/, which is this repository's own
  # directory. A target keeping five Nygard ADRs in docs/adr/ was invisible to
  # the contract, so the architecture document would have delegated arc42
  # section 9 to a directory the project does not have while the records it
  # does have sat unread beside it (#141).
  #
  # Candidates are in preference order, and the order only answers the empty
  # case: a project with no records is told where new ones will go. Where
  # records exist the tree decides, and two directories holding records are
  # reported rather than ranked, because which set of decisions is
  # authoritative is a person's call and not a default's.
  decision_records:
    candidates:
      - docs/decisions/
      - docs/adr/
      - docs/adrs/
      - docs/architecture/decisions/
      - doc/adr/

  required:
    - path: PRODUCT.md
      answers: What this is for, and how anyone tells it is done.
      sections:
        - name: Intent
          form: prose
          answers: What it does, for whom, in at most three sentences.
          excludes: History, technology, how it works.
        - name: Users
          form: table
          answers: Who uses it and what for. One row per kind of user.
        - name: Constraints
          form: table
          answers: >-
            What the product must hold to, and where that comes from. One row
            each, with a source. Binding constraints only, not preferences.
        - name: Definition of done
          form: list
          answers: >-
            Observable conditions that make the product correct. Each one
            testable. A condition that is not currently true says so.
        - name: Non-goals
          form: list
          answers: >-
            What a reader would reasonably expect and will not get. One line
            each.
        # A section rather than a testing document: the rest of what a testing
        # document would say is already in quality-gates.yml, and a second copy
        # is the copy that drifts.
        - name: Deliberately untested
          form: list
          answers: >-
            What is not covered, and why not. This is the section that stops
            the same argument recurring, and an empty one is a claim that
            everything is tested.

    - path: .specify/memory/constitution.md
      answers: The rules this project's work obeys.
      standard: RFC 2119
      sections: []
      per_principle:
        form: >-
          A name, one line stating the rule, then bullets using the RFC 2119
          keywords MUST, MUST NOT, SHOULD, SHOULD NOT, MAY. No explanatory
          paragraph before the rule: if the rule needs one to be understood, it
          is not yet written.
        excludes: >-
          Anything a policy file already holds. Reference the path instead --
          the constitution's own first principle requires it, and a constitution
          that restates policy is the drift it forbids.

    - path: .specify/lifecycle/architecture.md
      answers: How it is built, and how it should be.
      standard: arc42 (tailored)
      sections:
        - name: Context and scope
          form: prose
          answers: >-
            arc42 section 3. What the system talks to, and what lies outside
            it. The boundary, not the internals.
        - name: Building blocks
          form: table
          answers: >-
            arc42 section 5. Component, location, and its one responsibility,
            one row each. For an adopted project this is observed and every row
            carries evidence; for a new one it is intended and says so.
        - name: Solution strategy
          form: list
          answers: >-
            arc42 section 4. Numbered decisions about structure. A decision the
            code already reflects is observed; one it does not is intended, and
            in a project that has code that is a fix rather than a decision --
            see `provenance.remediation`.
        - name: Risks and technical debt
          form: table
          answers: >-
            arc42 section 11. What is known to be wrong or fragile, and what it
            costs. Empty is a claim; say so rather than omitting the section.
        - name: Seams
          form: table
          answers: >-
            Not an arc42 section, and kept because arc42 has no equivalent.
            Where a change can be made and observed without restructuring.
            Seam, location, what it enables.
      # Whether an entry describes the code or proposes a change to it.
      #
      # Both pilots wrote the same five sections carrying different kinds of
      # claim, and each invented its own disclaimer to compensate. Neither
      # disclaimer was required, so a document that omitted one read as
      # observed when it was not -- and a reader who takes a proposal for a
      # description acts on a false statement about the codebase.
      #
      # Per entry rather than per section, because one section holds both. It
      # is the author's own classification, made when the document is written
      # and true of the entry itself, so a checker can read it without
      # reaching outside the repository. That is also why there is no evidence
      # field: evidence is a claim about foreign code, and a check that could
      # only confirm a string is citation-shaped would manufacture confidence.
      provenance:
        markers:
          observed: Observed
          intended: Intended
        # Sections whose entries make claims. `Context and scope` is prose
        # about the boundary and states no per-entry claim, so it carries none.
        applies_to:
          - Building blocks
          - Solution strategy
          - Risks and technical debt
          - Seams
        form: >-
          Each entry opens with **Observed.** or **Intended.** -- a table row
          begins its first cell with it, a list item begins its text with it.
          An entry that declares neither is reported: unmarked reads as
          observed, and that is the reading that does harm.
        # An intended entry under a decisions heading, in a document that
        # observes anything at all, is a remediation wearing a decision's
        # clothes. A project with nothing observed has nothing to remediate,
        # so every entry there is legitimately intended.
        remediation:
          section: Solution strategy
          belongs: Risks and technical debt
      delegates:
        - >-
          arc42 section 9, Architectural Decisions, to the decision-record
          directory this project keeps, which `decision_records.candidates`
          resolves against the tree rather than fixing to one path. arc42
          permits the delegation explicitly, and a second decision format in
          one project is the drift the style rules forbid.

    - path: .specify/lifecycle/stack-decision.md
      answers: What it is built with, and what that commits the project to.
      standard: Nygard ADR
      sections:
        - name: Status
          form: prose
          answers: proposed, accepted, or superseded by a named record.
        - name: Context
          form: prose
          answers: >-
            What forced a choice. For an adopted project this is recovered and
            says where from.
        - name: Decision
          form: table
          answers: >-
            What was chosen and what was rejected, one row each, with the
            reason. A stack with no rejections records a habit, not a decision.
        - name: Consequences
          form: list
          answers: >-
            What this commits the project to, including what it forecloses and
            what becomes harder.

    - path: .specify/lifecycle/product-decisions.md
      answers: What was decided, when, and by whom.
      standard: Nygard ADR (log of)
      sections:
        - name: Open
          form: list
          answers: >-
            Questions not yet decided. A log with no open section claims
            everything is settled.
      per_entry:
        form: >-
          Heading is the date and the decision. Body carries Status, Context,
          Decision and Consequences, the same four an ADR carries, at one or
          two lines each. An entry needing more than that is an ADR, and
          belongs in the decision-record directory `decision_records` resolves,
          with this log referencing it.

    # Declared because the framework already requires one and never asked for
    # it: artifact-policy.yml gives a runbook `authority:
    # authoritative_operational`, and Output Done requires operability
    # discharged. A required artifact nobody is asked to write is a gap that
    # only shows up at the gate (#137).
    - path: .specify/lifecycle/runbook.md
      answers: How this is run, and what to do when it stops working.
      sections:
        - name: Running it
          form: list
          answers: >-
            The commands that start it locally, in order. A project with
            nothing to run says so; that is a fact about the project, not a
            missing section.
        - name: Configuration and secrets
          form: table
          answers: >-
            Each setting, where its value comes from, and what breaks without
            it. Never the value itself.
        - name: Observability
          form: prose
          answers: >-
            Where the logs, metrics, and traces are, and what normal looks
            like. Without the second half the first is a list of URLs.
        - name: When it breaks
          form: table
          answers: >-
            The failures that actually happen, and the first thing to check for
            each. Not every failure imaginable: the ones seen.
        - name: Rollback
          form: list
          answers: >-
            How a release is undone, and what cannot be. An irreversible step
            is named here or it is discovered during an incident.

    # The nouns of the project. Nothing else in the contract records what a
    # word means here, and a brownfield adoption reading somebody's codebase
    # has no worse failure than assuming a term means what it usually means.
    - path: .specify/lifecycle/domain.md
      answers: What the project's words mean, here specifically.
      sections:
        - name: Vocabulary
          form: table
          answers: >-
            Term, what it means here, and what it does not mean. The third
            column is the one that earns the document: it catches the word that
            means something else in this industry, or in the next team.
        - name: Relationships
          form: table
          answers: >-
            Which terms own which, and any cardinality that surprises people.
            A relationship nobody finds surprising does not need a row.
