artifacts:
  product_intent:
    authority: authoritative
    retention: product_lifetime
  constitution:
    authority: authoritative
    retention: project_lifetime
  living_spec:
    authority: authoritative
    retention: capability_lifetime
  plan:
    authority: derived_historical
    retention: archive_after_output_done
    regenerable: true
  tasks:
    authority: derived_ephemeral
    retention: delete_or_archive_after_output_done
    regenerable: true
  prototype:
    authority: ephemeral
    retention: delete_or_archive_after_decision

    # Promotion is an explicit decision, and this record is what makes that
    # real rather than stated: work informed by a
    # prototype or spike cannot reach Output Done until the disposal is
    # decided.
    #
    # The failure this prevents is quiet. Nobody decides to ship prototype
    # code; it is left in place because deleting it needs a reason and keeping
    # it needs none. Requiring the decision inverts that.
    disposal_record:
      decisions:
        delete: the artifacts are removed; nothing survives the learning
        archive: kept as evidence, outside any build, not importable
        promote: >-
          carried into production. Requires an approver and a reason, because
          this is the decision the ephemeral classification exists to make
          deliberate.
      required_fields:
        - id: kind
          values: [prototype, spike]
        - id: questions
          note: what it set out to answer
        - id: findings
          note: >-
            what was learned. "unresolved" is a legitimate finding; a
            prototype that answered nothing has still told you something.
        - id: decision
          note: one of the decisions above
        - id: artifacts
          note: what exists as a result, so disposal can be checked
      promote_requires: [approver, reason]

      # A spike is bounded before it starts, or it is not a spike.
      spike_required_fields: [question, permitted_scope, required_evidence,
                              time_box, exit_criteria]

      rules:
        - >-
          Work informed by a prototype or spike cannot reach Output Done until
          a disposal decision is recorded.
        - >-
          Promotion names an approver and a reason. Neither is inferable, and a
          record missing either is refused rather than defaulted.
        - >-
          Deleting or archiving names the artifacts, so a reader can check the
          disposal happened rather than trusting that it did.
  adr:
    authority: historical
    retention: project_lifetime
    update_policy: supersede_not_rewrite
  discovery_notes:
    authority: evidence_ephemeral
    retention: archive_or_delete_after_reconciliation

    # The record's shape, because three later workflows read it: prototype,
    # spike, and the uncertainty branch of story delivery. Getting it wrong
    # means rewriting all three, so it is defined before any of them exist.
    #
    # evidence_ephemeral is the whole constraint. Discovery reports what is
    # there; it never establishes what was wanted. A finding becomes intent
    # only through reconciliation with a spec, which is a separate act by a
    # different authority.
    record:
      sections:
        - id: scope
          label: Scope
          prompt: What was examined, and what was deliberately not.
        - id: capability_boundary
          label: Capability boundary
          prompt: Where this capability starts and stops.
        - id: entry_points
          label: Entry points
          prompt: How execution reaches it.
        - id: data_ownership
          label: Data ownership
          prompt: What data it owns, and what it only reads.
        - id: external_dependencies
          label: External dependencies
          prompt: What it needs that it does not control.
        - id: trust_boundaries
          label: Trust boundaries
          prompt: Where input stops being trusted.
        - id: current_behaviour
          label: Current behaviour
          prompt: >-
            What it does now. Each observation states whether it is specified
            or inferred.
        - id: current_tests
          label: Current tests
          prompt: What is covered, and what that coverage would not catch.
        - id: open_uncertainty
          label: Open uncertainty
          prompt: >-
            Questions the code does not answer. Recorded, never resolved by
            guessing.
        - id: safe_seams
          label: Safe seams
          prompt: Where a change could be made with the least blast radius.
        - id: security_observations
          label: Security observations
          prompt: What an attacker could reach, and what stops them.

      # An observation is one or the other, and which matters more than the
      # observation. A reader cannot otherwise tell a decision from a guess.
      behaviour_sources:
        specified: agreed somewhere a reader can find
        inferred: read from code, with nothing confirming it was wanted

      rules:
        - >-
          Every section appears. A section with nothing to report says so,
          because an absent section and an empty one mean different things and
          only one of them was investigated.
        - >-
          Inferred behaviour is never written as intended behaviour, and never
          becomes an acceptance criterion without reconciliation.
        - >-
          Open uncertainty is recorded rather than answered. An invented answer
          is worse than an admitted question: it stops anyone looking.
        - >-
          Discovery modifies nothing outside its own record.
  outcome_record:
    authority: historical_evidence
    retention: product_governance_policy
  runbook:
    authority: authoritative_operational
    retention: while_operation_exists
