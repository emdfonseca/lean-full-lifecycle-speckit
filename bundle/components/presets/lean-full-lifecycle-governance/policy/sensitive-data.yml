# What the framework may read, and what may end up in the evidence it writes.
#
# Coverage was scattered: agent-policy denies production access, quality-gates
# requires secret detection, risk-policy escalates regulated data. The only
# implemented redaction covered the GitHub adapter's audit trail. Nothing
# covered the records the workflows themselves write -- discovery, disposal,
# outcome, plans -- which is where production data actually lands during a
# brownfield adoption.

production_data:
  # Denied by default. An agent reading production data is a decision a person
  # makes, once, in the open.
  default: deny
  rule_id: SENSITIVE-PROD-001
  rule: >-
    Production data is denied to the agent unless a named human has authorized
    that specific read. Denial is the default because the alternative is an
    agent deciding for itself what it may see.

  # Authorization is a record, not a claim. "The user said it was fine" is not
  # one.
  authorization:
    required_fields: [authorized_by, source, scope, expires_at]
    authorities: [data_owner, security_owner]

  denied_sources:
    - production_database
    - production_logs
    - production_backups
    - production_exports
    - customer_records
    - payment_records

denied_paths:
  # Paths, not data sources. `denied_sources` above names six places
  # production data lives; none of them is a file on disk, so nothing here
  # stopped an agent reading `.env` or a private key. These are the shapes a
  # secret has when it is a file.
  #
  # Globs rather than regexes: these become permission rules in a generated
  # agent configuration, and the agents express path rules as globs. A
  # pattern that cannot be emitted is a pattern that protects nothing.
  rule_id: SENSITIVE-PATH-001
  rule: >-
    Reading a file whose path matches a denied pattern is refused. Refusal is
    at the path, before the read, because a secret that has been read has
    already entered the context that a later redaction cannot reach.
  patterns:
    - id: dotenv
      glob: "**/.env"
      why: Conventional home for credentials in a working tree.
    - id: dotenv_variants
      glob: "**/.env.*"
      why: .env.local and .env.production carry the same content.
    - id: private_key
      glob: "**/*.pem"
      why: Private keys, whatever the surrounding filename says.
    - id: private_key_rsa
      glob: "**/id_rsa"
      why: >-
        Default OpenSSH key name. Listed separately from the .ssh rule below
        because a key copied out of .ssh is still a key.
    - id: private_key_ed25519
      glob: "**/id_ed25519"
      why: The modern default, same reasoning.
    - id: pkcs12
      glob: "**/*.p12"
      why: Certificate bundles, which carry the private half.
    - id: pfx
      glob: "**/*.pfx"
      why: The Windows spelling of the same bundle.
    - id: netrc
      glob: "**/.netrc"
      why: Stores host credentials in cleartext.
    - id: aws_credentials
      glob: "**/.aws/credentials"
      why: Long-lived access keys.
    - id: gcp_service_account
      glob: "**/gcloud/*.json"
      why: Service-account keys are JSON and look ordinary.
    - id: kubeconfig
      glob: "**/.kube/config"
      why: Cluster credentials.
    - id: ssh_dir
      glob: "**/.ssh/**"
      why: Everything in it, because the safe members are not worth enumerating.
    - id: keyring
      glob: "**/*.kdbx"
      why: Password database.

redaction:
  # Visible, so a reader can tell something was removed. A silent redaction
  # leaves evidence that reads as complete and is not.
  marker: "[redacted]"
  visible: true
  # Redaction happens after the read. It cannot make an unauthorized read
  # authorized, and treating it that way is what makes a denial policy
  # decorative.
  is_not_authorization: true

credential_shapes:
  # Named shapes, matched against the evidence records the framework writes.
  # A finding names the record and the field. It never quotes the value: a
  # report that repeats the secret has copied it somewhere new.
  - id: github_token
    pattern: "gh[pousr]_[A-Za-z0-9]{16,}"
  - id: github_pat
    pattern: "github_pat_[A-Za-z0-9_]{20,}"
  - id: labelled_secret
    pattern: "(?i)\\b(authorization|bearer|token|secret|password|api[_-]?key)\\b\\s*[:=]\\s*\\S+"
  - id: aws_access_key
    pattern: "AKIA[0-9A-Z]{16}"
  - id: private_key_block
    pattern: "-----BEGIN (?:RSA |EC |OPENSSH |PGP )?PRIVATE KEY-----"
  - id: connection_string
    pattern: "(?i)\\b(?:postgres|postgresql|mysql|mongodb|redis|amqp)://[^\\s/@]+:[^\\s/@]+@"
  - id: jwt
    pattern: "eyJ[A-Za-z0-9_-]{10,}\\.eyJ[A-Za-z0-9_-]{10,}\\."

scanned_records:
  # Every record the framework writes and a person later reads.
  - discovery_record
  - disposal_record
  - outcome_record
  - transition_plan
  - readiness_verdict
  - exception_record
