name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python scripts/generate_manifests.py --check
      - run: python scripts/generate_catalogs.py --check
      - run: python scripts/validate_source.py
      - run: python scripts/validate_requirements.py
      - run: python -m pytest -m 'not sandbox'
      - uses: astral-sh/setup-uv@v5
      - name: Install pinned Spec Kit
        run: |
          uv tool install --from git+https://github.com/github/spec-kit.git@v1.0.1 specify-cli
          echo "$(uv tool dir)/bin" >> "$GITHUB_PATH"
      - name: Official bundle validate and build
        run: |
          specify bundle validate --path bundle/ --offline
          specify bundle build --path bundle/ --output dist/
      - name: Sandbox lifecycle over a local catalog
        run: python -m pytest -m sandbox
      - name: Requirement coverage
        run: python scripts/validate_requirements.py --report md >> "$GITHUB_STEP_SUMMARY"
