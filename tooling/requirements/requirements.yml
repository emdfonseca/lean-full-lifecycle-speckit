      - "tests/test_check_negatives.py::test_every_check_has_a_negative_case"
  - id: REQ-WORKFLOW-TIMEOUT-001
    statement: >-
      Every prompt step declares how long it may take, drawn from a named tier
      in bootstrap-policy.yml. No step runs on an unstated default, and no
      check infers which steps are expensive from their names: the first
      attempt keyed on the step id and the very next step of the same workflow
      matched no rule and timed out. An author choosing a tier is reliable
      where inference is not, so a step with no timeout, or with a value the
      policy does not name, is reported.
    priority: must
