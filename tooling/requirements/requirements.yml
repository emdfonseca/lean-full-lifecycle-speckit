      - "tests/test_board.py::test_every_flag_the_refusal_names_is_a_real_flag"

  - id: REQ-GITHUB-BOARD-001
    statement: >-
      An item the framework creates must be placed on the board, because
      delivery state lives there and an item off the board cannot be
      transitioned. Placement is idempotent, takes the issue id rather than its
      number, reads the new item back directly rather than re-listing, and a
      capture that cannot place an item reports that rather than returning a
      clean creation.
