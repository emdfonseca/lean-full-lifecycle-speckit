  - id: REQ-BACKLOG-RETIRE-002
    statement: >-
      Previewing a retirement must succeed. A dry run performs no write,
      reports the route, the reason and any successor it would have applied,
      and exits zero, because a read-back that verifies a write the dry run
      deliberately skipped reports the skip as a failed write and makes the
      safe way to check a retirement the one path that cannot work. The dry
      run still applies every refusal the real command applies, and the
      read-back still guards the path that actually writes.
