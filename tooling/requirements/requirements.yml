      a declared vocabulary and the evidence behind it, never a quantity. A
      verdict with no evidence is refused, because the verdict is the part that
      invites a shrug and the evidence is what stops it. The vocabulary
      separates three states an integer conflated: not applicable, meaning the
      stream does not do that thing; unmeasured, meaning it applies and no
      instrument exists, which is a gap in the framework rather than in the
      pilot; and unrecorded, meaning nobody filled it in, which a finished
      record may never carry. An entry the run either upheld or did not may
      declare the verdicts it accepts, so it cannot be answered with a shrug.
      An absent entry is not read as an answer, an entry the contract does not
      declare is refused, an empty failure list is an explicit claim rather
      than an omission, every failure names the item tracking it, and the
      shipped template does not validate clean. No entry asks for a self-rated
      score, and no source is declared that no entry uses: a vocabulary with an
      unused member reads as a capability the contract does not have.
    priority: should
    owner: product/process owner
    release: "0.9.0"
    status: verified
    components:
      - script:tooling/pilots/pilot_record.py
    verified_by:
