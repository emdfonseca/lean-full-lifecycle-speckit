  - id: REQ-RISK-SCORING-001
    statement: >-
      An item's risk is scored from risk-policy.yml and the score names the
      controls that band requires. Every weight, threshold, override and
      control set is read from the installed policy; no dimension, override or
      band name appears in the code. A declared override escalates outright
      regardless of the weighted total, because the dimensions describe degree
      and the overrides describe kind. A rating outside the policy's range, a
      dimension the policy does not declare, an override it does not declare,
      and a total no band covers are each refused or reported rather than
      absorbed. The escalation target is the band with the greatest minimum
      rather than a literal name, and the report states that the controls it
      names are required and not certified.
