  - id: REQ-GITHUB-BACKENDS-001
    statement: >-
      What each backend can carry is recorded, and a role it cannot carry names
      what the project loses and how to reach it. Not every backend carries
      every role: organization Issue Fields apply to every repository in the
      organization and this bundle performs no organization schema mutation, so
      four roles cannot be created there. Silence about a role reads as support
      for it, so every backend accounts for the same set, an unavailable role
      carries a reason, and a backend with unavailable roles carries a remedy.
      Inspection reports the consequence rather than the bare absence, and whether a workflow writes the role is derived from the workflows rather than inferred from the backend: a backend able to carry a role says nothing about whether its absence costs anything, and conflating them reported a role two workflows write as harmless. and a
      preset without the matrix loses the explanation rather than the
      inspection.
    priority: must
    owner: framework
    release: "0.3.0"
    status: verified
    components:
      - check:INV-ROLE-REACHABLE
      - script:bundle/components/extensions/github-lifecycle/scripts/inspect_target.py
      - policy:github-schema.yml
    verified_by:
      - "tests/test_inspect.py::test_every_backend_accounts_for_the_same_roles"
      - "tests/test_inspect.py::test_the_organization_backend_records_what_it_cannot_carry"
      - "tests/test_inspect.py::test_a_missing_role_says_what_the_project_loses"
      - "tests/test_inspect.py::test_a_role_nothing_writes_says_nothing_is_blocked"
      - "tests/test_inspect.py::test_an_older_preset_loses_the_explanation_not_the_inspection"
      - "tests/test_inspect.py::test_a_role_no_workflow_writes_is_harmless_even_with_no_matrix"
      - "tests/test_check_negatives.py::test_check_detects_its_own_violation[INV-ROLE-REACHABLE]"
      - "tests/test_check_negatives.py::test_check_passes_on_clean_source[INV-ROLE-REACHABLE]"
    evidence:
      - "Issue #118"
      - "Issue #103"

  - id: REQ-GITHUB-PROJECTSCOPE-001
    statement: >-
      A repository resolves only to a board it is linked to, never to one its
      owner merely has. The owner-wide listing let a repository inherit an
      unrelated board, and with exactly one board the ambiguity branch never
      fired, so the wrong board was adopted silently and reported usable --
      items would have been written onto another repository's roadmap.
      authoritative_project_count reads as protection against that and is not,
      because it counts what the owner has rather than what the repository is
      linked to. The lookup is GraphQL because no REST endpoint answers it, and
      the owner-wide listing survives only for discovery before a repository is
      relevant. A repository linked to nothing is an ambiguity naming the
      repository, not a silently chosen board.
    priority: must
    owner: framework
    release: "0.3.0"
    status: verified
    components:
      - script:bundle/components/extensions/github-lifecycle/scripts/inspect_target.py
      - policy:github-schema.yml
    verified_by:
      - "tests/test_inspect.py::test_a_repository_is_not_offered_its_owners_unlinked_board"
      - "tests/test_inspect.py::test_a_linked_board_is_offered"
      - "tests/test_inspect.py::test_a_second_unlinked_board_changes_nothing"
      - "tests/test_inspect.py::test_the_repository_scoped_lookup_uses_graphql"
      - "tests/test_inspect.py::test_owner_wide_discovery_survives_for_the_case_that_needs_it"
      - "tests/test_inspect.py::test_no_linked_board_is_an_ambiguity_naming_the_repository"
    evidence:
      - "Issue #120"
      - "Issue #104"

  - id: REQ-GITHUB-BOARD-005
    statement: >-
      A board that already exists can be given the states the policy declares,
      and every option it already carries keeps its id. An item's stored value
      is an option id, not a name, so replacing the option set by name alone
      clears the value from every item holding one. Removing an option the
      policy no longer declares is refused rather than performed, because that
      clears it from every item too and is a decision about those items. A
      board already matching the policy is not written to at all. Every flag a
      refusal names is a flag the parser accepts.
    priority: must
    owner: framework
    release: "0.3.0"
    status: verified
    components:
      - command:speckit.github-lifecycle.board
    verified_by:
      - "tests/test_board.py::test_reshaping_adds_a_new_state_and_keeps_every_existing_option_id"
