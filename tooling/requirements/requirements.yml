      - "tests/sandbox/test_bundle_mechanics.py::test_update_restores_a_deleted_component_file"
      - "tests/sandbox/test_bundle_mechanics.py::test_reinstall_restores_presets_commands_and_components"
      - "tests/sandbox/test_bundle_mechanics.py::test_installing_from_a_built_archive_is_recorded"
      - "tests/sandbox/test_bundle_mechanics.py::test_a_failed_install_leaves_no_partial_component"
    evidence:
      - "Issue #83"

  - id: REQ-TOOLING-ACCEPTANCE-001
    statement: >-
      The acceptance registry has a strict schema and resolves behavioral test
      evidence against pytest collection. Wording-only tests cannot count as
      behavioral evidence, blocked and pilot scenarios remain distinct from
      test gaps, and the P12 exit gate rejects every must scenario not covered.
