  - id: REQ-CORE-RATCHET-002
    statement: >-
      A ratchet baseline records what it measured, and is compared only with a
      run under the same conditions. A run that states no conditions is
      refused, and so is a baseline that records none, rather than being
      compared against. A gate holds a baseline per set of conditions, so
      widening what is measured establishes its own baseline instead of reading
      as a regression, and narrowing it cannot move the baseline the project is
      held to. The recorder writes exactly the fields quality-gates.yml
      declares, so a field added to the policy cannot leave the checker writing
      the old set.
    priority: must
    owner: framework
    release: "0.3.0"
    status: verified
