  - id: REQ-WORKFLOW-VERDICT-001
    statement: >-
      A bootstrap run must not claim more than it did. A gate message that says
      approving *applies* a resolution requires a step reading that verdict;
      where nothing reads it, the message says so instead. Approving
      `approve-verification-resolution` promised the missing verification
      commands were resolved, and no step in either bootstrap workflow reads
      `verification_verdict` -- the one step that ever wrote an overlay sits in
      the scope switch, ahead of the gate -- so the message now states that
      approving records the choice and applies nothing. The blanket rule, that
      every gate's verdict is read by a later step, is deliberately not the
      requirement: for `adoption_verdict` and `discovery_verdict` approve means
      proceed and `on_reject: abort` is the whole consumption. Ending the run
      is the second claim. The engine marks a run `completed` whenever no step
      raised, so a validation prompt writing a blocker into its report cannot
      stop it, and a run reported `completed` while its own report named the
      verification commands as outstanding. The validation report now records
      an Unresolved blockers line and a final gate shows it, so the run reaches
      its end only through a verdict given against that line.
    priority: must
    owner: framework
    release: "0.3.0"
    status: verified
    components:
      - workflow:lifecycle-brownfield-adoption
      - workflow:lifecycle-greenfield-bootstrap
    verified_by:
