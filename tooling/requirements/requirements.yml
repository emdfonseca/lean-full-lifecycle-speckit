  - id: REQ-CORE-GATERES-001
    statement: >-
      Every quality gate quality-gates.yml declares must carry exactly one
      recorded outcome on a project: resolved with the command that satisfies
      it, declined with the reason it was rejected, or filed naming the backlog
      item created for it. A gate with no outcome is reported unexamined rather
      than omitted, because an absent gate reads as a gate with nothing wrong.
      A filed gate names work not yet done and leaves the project unsettled. A
      conditional gate is reported with the condition it applies under, which
      is rendered from policy rather than stored. A merge that cannot be
      applied whole is applied not at all, so a run that stops mid-way leaves
      no outcome nobody decided.
    priority: must
    owner: framework
    release: "0.3.0"
    status: verified
