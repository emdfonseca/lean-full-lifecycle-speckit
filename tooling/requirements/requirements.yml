  - id: REQ-GITHUB-INVOCATION-001
    statement: >-
      A command declares its script in front matter and writes the substitution
      token in its prose, never a literal interpreter. Spec Kit resolves an
      interpreter per project -- a virtual environment first, then python3,
      then python -- and prescribing a literal bypasses that resolution, which
      fails where no python is on PATH, where python3 is too old to parse the
      scripts, and where it lacks PyYAML. Declaring the script also makes the
      command addressable as an event handler, which an undeclared one is not.
    priority: must
    owner: framework
    release: "0.3.0"
    status: verified
    components:
