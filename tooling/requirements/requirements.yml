  - id: REQ-PACKAGE-MECHANICS-001
    statement: >-
      The install lifecycle must be verified by its effects, not by exit
      codes. The official validator runs in the suite and is shown able to
      fail; a local source install materializes every declared component; an
      update restores a component that was changed or deleted, so an update
      that refreshed nothing cannot pass; a reinstall is asserted to have
      restored the presets, components, and files removal took; the behaviour
      of installing from a built archive is pinned; and a failed install leaves
      no partial component and is not recorded as installed.
