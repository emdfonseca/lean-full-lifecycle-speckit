  - id: REQ-BACKLOG-RESTRUCTURE-001
    statement: >-
      A Story too large to start is replaced by the Stories it should have
      been, and two that turned out to be one leave one carrying the work.
      Both end the original through a declared closure route rather than
      leaving it open, and the reason names every successor. A split creates
      siblings taking the original's parent, never children of it, because
      item-types.yml declares only Epics decomposable; these operations are
      kept out of decompose, whose model is the opposite. A split into one item
      is refused as a rewrite, a merge requires distinct keep and drop rather
      than inferring survival from argument order, and either operation on an
      item with open children is refused with the children named.
    priority: should
    owner: product/process owner
    release: "0.3.0"
    status: verified
    components:
      - command:speckit.github-lifecycle.restructure
