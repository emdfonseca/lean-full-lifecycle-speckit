      - "tests/test_verify_bootstrap.py::test_the_resolution_gate_says_approving_applies_nothing[lifecycle-greenfield-bootstrap]"
      - "tests/test_verify_bootstrap.py::test_the_run_cannot_reach_its_end_without_a_verdict_on_the_report[lifecycle-brownfield-adoption]"
      - "tests/test_verify_bootstrap.py::test_the_run_cannot_reach_its_end_without_a_verdict_on_the_report[lifecycle-greenfield-bootstrap]"
      - "tests/test_verify_bootstrap.py::test_the_final_gate_shows_the_report_the_step_before_it_writes[lifecycle-brownfield-adoption]"
      - "tests/test_verify_bootstrap.py::test_the_final_gate_shows_the_report_the_step_before_it_writes[lifecycle-greenfield-bootstrap]"
