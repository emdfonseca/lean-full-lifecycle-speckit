  - id: REQ-WORKFLOW-GATEART-001
    statement: >-
      A step that writes an artifact a later gate asks a person to approve
      instructs that artifact to open by naming the decisions needing
      judgement, each pointing at the section holding its evidence, and to
      define a cross-referenced label under that same label and under a
      heading. The check covers a gate whose show_file names authored prose; a
      gate showing a file a shipped script writes is exempt by ownership, and a
      gate showing no file is not covered because the artifact it approves comes
      from outside this bundle.
    priority: must
    owner: framework
    release: "0.3.0"
    status: verified
