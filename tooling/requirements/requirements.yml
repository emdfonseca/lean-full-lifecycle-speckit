  - id: REQ-SECURITY-ROUTING-001
    statement: >-
      How the installed model inventory is read is declared per integration,
      because no one command answers for both shapes the bundle claims. Every
      integration compatibility.yml claims carries an entry, and an integration
      that cannot be asked declares null rather than being omitted: absent
      reads as an oversight and a wrong command reads as a capability. An
      unreadable inventory refuses rather than approving every model, since
      approving everything because nothing could be checked is how an approved
      provider requirement becomes decorative. A policy predating the
      per-integration form still resolves.
