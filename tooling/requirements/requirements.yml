      - "Issue #106"

  - id: REQ-BACKLOG-CLOSURE-002
    statement: >-
      Being exempt from the terminal delivery state is not being exempt from
      claiming work. A not_planned or duplicate closure is rightly excused from
      reaching Output Done, because requiring a state the work never earned is
      how a board starts recording fiction. That exemption also excused the
      item from leaving the column it stopped in, so a duplicate closed weeks
      earlier sat in In Progress and the board said somebody was building it.
      Those are two claims and the audit now separates them: the closure route
      stays unreported, and an exempt closure resting in a state that asserts
      active work is reported, naming the state and what it claims. The states
      that assert work are derived from the machine's own order rather than
      listed, because a second copy of the policy is the copy that drifts:
      Inbox asserts nothing beyond existence and Output Done asserts
      completion, so a closed item at either end says nothing false, and
      everything between them says something actionable. An item is reported
      once, since two findings for one fact teaches a reader to skim.
    priority: must
    owner: framework
    release: "0.3.0"
    status: verified
    components:
      - policy:state-machine.yml
      - script:bundle/components/extensions/github-lifecycle/scripts/transition_plan.py
    verified_by:
      - "tests/test_transition.py::test_an_exempt_closure_left_where_work_is_claimed_is_reported"
      - "tests/test_transition.py::test_an_exempt_closure_at_inbox_is_not_reported"
      - "tests/test_transition.py::test_a_completed_closure_is_reported_once_not_twice"
      - "tests/test_transition.py::test_the_states_that_claim_work_come_from_the_machine"
    evidence:
      - "Issue #139"
      - "Issue #103"

  - id: REQ-BACKLOG-CLOSURE-001
    statement: >-
      Closure is judged against the route it was closed by. `state-machine.yml`
      declares each route and whether it requires the terminal delivery state;
      a route declaring set_output_done false closes work that never reached
      Output Done and is not reported, because requiring a state the work did
      not earn is how a board starts recording fiction. The exempt reasons are
      derived from the policy rather than listed in the audit, so adding a
      route is a policy edit alone. Exemption is an allowlist: a close reason
      the policy has not considered is reported rather than silently permitted.
      A completed closure short of Output Done is still reported, which is the
      rule the exemption must not weaken.
    priority: must
    owner: product/process owner
    release: "0.3.0"
    status: verified
    components:
      - policy:state-machine.yml
      - script:bundle/components/extensions/github-lifecycle/scripts/transition_plan.py
    verified_by:
      - "tests/test_transition.py::test_closed_while_not_output_done_is_reported"
      - "tests/test_transition.py::test_a_not_planned_closure_is_not_reported"
      - "tests/test_transition.py::test_a_duplicate_closure_is_not_reported"
      - "tests/test_transition.py::test_a_completed_closure_short_of_output_done_is_still_reported"
      - "tests/test_transition.py::test_an_unknown_close_reason_is_reported_rather_than_exempted"
      - "tests/test_transition.py::test_the_exempt_reasons_come_from_policy_not_from_the_audit"
      - "tests/test_transition.py::test_the_policy_declares_the_route_supersession_will_use"
    evidence:
      - "Issue #107"

  - id: REQ-BACKLOG-RETIRE-001
    statement: >-
      An item can be ended without being delivered, by a route the state
      machine declares for undelivered work, and never by inventing a delivery
      state it did not earn. The routes are read from policy, so one added
      there needs no code change, and a route requiring a delivery state is not
      offered here because completing work is what transition does. A
      retirement states its reason, a supersession names the item that now
      carries the work and both issues reference each other, and an item with
      open children is refused rather than stranding them. Every refusal
      happens before any write, and an undeclared route is refused without
      reaching the API. The close is read back, because a write that reports
      success while the read disagrees is not a success.
    priority: must
    owner: product/process owner
    release: "0.3.0"
    status: verified
