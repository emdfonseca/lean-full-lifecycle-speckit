  - id: REQ-GITHUB-CONFIG-002
    statement: >-
      A configured project number belongs to the configured repository. A
      command aimed at a different repository does not inherit it, because a
      board is linked to one repository and an inherited number pointed a
      command at another project's board while reporting the backend usable.
      An explicit project alongside an explicit repository is honoured: the
      caller named both halves, so nothing is inherited and nothing is silent,
      which is the whole defect. A config declaring no repository constrains
      nothing.
    priority: must
    owner: framework
    release: "0.3.0"
    status: verified
    components:
