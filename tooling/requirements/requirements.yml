  - id: REQ-BACKLOG-BUILDORDER-001
    statement: >-
      Work does not begin before the item says so, enforced where enforcement
      is installable and reported where it is not. A workflow that both
      transitions an item to the start state and implements it must transition
      first, checked by identifying the steps from what they invoke rather than
      from their ids, because `work_started` is evidence that means nothing if
      the work started first. Outside a workflow the bundle cannot prevent it:
      an events guard is not armed by `specify bundle install`, so the audit
      reports a working tree carrying tracked modifications while no open item
      is In Progress. Untracked files do not count, a closed item does not
      silence it, and git being unable to answer is reported as unknown rather
      than as clean.
    priority: must
