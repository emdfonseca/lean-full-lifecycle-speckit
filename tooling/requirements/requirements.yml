  - id: REQ-WORKFLOW-TIMEOUT-002
    statement: >-
      A prompt step's declared timeout tier is read against the work its own
      prompt describes, not against its id. A step whose prompt tells the model
      to apply, implement, build, remediate, refactor, or migrate is building an
      artifact from a codebase and declares the artifact_synthesis tier. The
      verb must open a directive, so a noun in a wrapped line does not retier a
      step that only reads and reports. When the policy declares no
      artifact_synthesis tier the check refuses rather than passing silently,
      because a check that no-ops on missing input reports a coverage it does
      not have.
    priority: must
    owner: framework
    release: "0.3.0"
    status: verified
    components:
