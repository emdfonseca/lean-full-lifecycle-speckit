  - id: REQ-PRODUCT-DOCUMENTS-003
    statement: >-
      No shipped surface instructs a document budget the policy does not
      declare. Length stopped being budgeted because a line count is wrong for
      somebody, but the prose telling people to obey one stayed in three
      places: the command document, the `args` of the step that writes the
      documents in both bootstrap routes, and the closing clause of the
      requirement that declared the contract. The command document misleads a
      reader; the workflow `args` instruct the agent that is writing the
      documents, which is where a document actually gets shortened to fit a
      number nobody declares. Stating that length is not budgeted is not the
      same as instructing a budget, so what is refused is the instruction. The
      check applies only while the policy declares no budget: reinstating one
      must make it stop refusing rather than require deleting it.
    priority: must
    owner: framework
    release: "0.3.0"
    status: verified
    components:
