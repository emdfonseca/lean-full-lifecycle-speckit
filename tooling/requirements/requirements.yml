# The requirement catalogue.
#
# Every requirement resolves to real components and, once implemented, to real
# tests. `scripts/validate_requirements.py` checks both directions: a
# requirement naming a test that does not claim it fails, and a test claiming a
# requirement that does not name it fails. That reciprocity is the whole point.
# A catalogue that can drift from the suite is documentation, not traceability.
#
# Families are an allowlist. The roadmap names eighteen; nine cover work in
# flight. Adding one is deliberate.
schema_version: "1.0"

families:
  - REQ-CORE        # preserve Spec Kit and official Lean behaviour
  - REQ-PACKAGE     # build, catalog, install, update, remove
  - REQ-SECURITY    # injection, credentials, permission boundaries
  - REQ-STATE       # readiness, Output Done, Outcome Status
  - REQ-GITHUB      # Issue Fields, hierarchy, deterministic mutation
  - REQ-TOOLING     # source-tree invariants and single source of truth
  - REQ-DOCS        # documentation truthfulness
  - REQ-BACKLOG     # triage, refine, decompose, capture
  - REQ-UNCERTAINTY # discovery, prototype, spike, threat analysis
  - REQ-TEAM        # project and feature context, parallel teams
  - REQ-RISK        # scoring a change, and the controls its band requires
  - REQ-PILOT       # what a pilot run must record to count as evidence
  - REQ-WORKFLOW    # how a workflow step is bounded and run
  - REQ-PRODUCT     # the documents a project must have, and how terse
  - REQ-RELEASE     # cutting a release, and what a rung still needs

gates:
  - release: "0.9.0"
    statement: >-
      Four pilot streams complete with collected evidence, signed off by their
      named pilot owners.
    status: pending
  - release: "1.0.0"
    statement: >-
      The repository is public and the published catalogs resolve for a user
      who is not the author.
    status: pending

requirements:

  # --- composition -----------------------------------------------------------

  - id: REQ-CORE-COMPOSE-001
    statement: >-
      The governance preset composes additively over the official Lean preset.
      Core command content contributed by Lean, or by Spec Kit where Lean
      contributes none, survives installation intact.
    priority: must
    owner: engineering governance owner
    release: "0.1.1"
    status: verified
    components:
      - preset:lean-full-lifecycle-governance
      - check:INV-PRESET-COMPOSITION
    verified_by:
      - "tests/sandbox/test_lifecycle.py::test_preset_composition_layers_over_lean"
      - "tests/test_check_negatives.py::test_check_detects_its_own_violation[INV-PRESET-COMPOSITION]"
    evidence:
      - "docs/evidence/substrate-1.0.1.md#h7-composition-is-correct"

  - id: REQ-CORE-COMMANDS-001
    statement: >-
      Every command a workflow step invokes is provided by an installed
      component. A workflow cannot reference a command that will not exist.
    priority: must
    owner: workflow maintainer
    release: "0.1.1"
    status: verified
    components:
      - check:INV-COMMAND-RESOLVES
    verified_by:
      - "tests/test_inventory.py::test_provided_commands_covers_every_workflow_step"
      - "tests/test_check_negatives.py::test_check_detects_its_own_violation[INV-COMMAND-RESOLVES]"

  # --- packaging -------------------------------------------------------------

  - id: REQ-PACKAGE-CATALOG-001
    statement: >-
      The bundle installs into a clean Spec Kit project from a catalog, which is
      the only path a real user has. A built archive is a manifest of references
      and installs nothing on its own.
    priority: must
    owner: release owner
    release: "0.1.1"
    status: verified
    components:
      - script:scripts/local_catalog.py
      - script:scripts/generate_catalogs.py
    verified_by:
      - "tests/sandbox/test_lifecycle.py::test_bundle_installs_from_catalog"
      - "tests/sandbox/test_lifecycle.py::test_all_workflows_installed"
    evidence:
      - "docs/evidence/substrate-1.0.1.md#d7-the-artifact-is-not-self-contained"

  - id: REQ-PACKAGE-LIFECYCLE-001
    statement: >-
      Install, second install, update, remove, and reinstall each succeed, and a
      second install changes nothing.
    priority: must
    owner: release owner
    release: "0.1.1"
    status: verified
    components:
      - script:scripts/smoke_test.py
    verified_by:
      - "tests/sandbox/test_lifecycle.py::test_second_install_is_idempotent"
      - "tests/sandbox/test_lifecycle.py::test_bundle_update_succeeds"
      - "tests/sandbox/test_lifecycle.py::test_remove_then_reinstall"

  - id: REQ-PACKAGE-ARTIFACT-001
    statement: >-
      The published artifact contains the bundle and nothing else. Development
      tooling, tests, build output, and CI configuration are structurally
      outside the packaged directory rather than filtered out of it.
    priority: must
    owner: bundle maintainer
    release: "0.1.1"
    status: verified
    components:
      - script:scripts/build_release.py
    verified_by:
      - "tests/test_packaging.py::test_every_artifact_entry_is_declared_by_the_inventory"
      - "tests/test_packaging.py::test_no_component_archive_ships_build_residue"
    evidence:
      - "docs/decisions/0001-target-spec-kit-1-0-x.md"

  - id: REQ-PACKAGE-PIN-001
    statement: >-
      One declared Spec Kit version range governs the bundle, and every manifest
      and catalog entry states it identically.
    priority: must
    owner: bundle maintainer
    release: "0.1.1"
    status: verified
    components:
      - check:INV-SPECKIT-PIN
    verified_by:
      - "tests/test_check_negatives.py::test_check_detects_its_own_violation[INV-SPECKIT-PIN]"

  - id: REQ-PACKAGE-OVERLAY-001
    statement: >-
      A project workflow overlay survives bundle update, workflow update, and
      repeated install, and continues to apply. A product repository does not
      lose its customization by upgrading.
    priority: must
    owner: workflow maintainer
    release: "0.1.1"
    status: verified
    components:
      - workflow:lifecycle-story-delivery
    verified_by:
      - "tests/sandbox/test_overlays.py::test_overlay_applies_before_any_update"
      - "tests/sandbox/test_overlays.py::test_overlay_survives_bundle_update"
      - "tests/sandbox/test_overlays.py::test_overlay_survives_workflow_update"
      - "tests/sandbox/test_overlays.py::test_overlay_survives_second_bundle_install"

  # --- tooling ---------------------------------------------------------------

  - id: REQ-TOOLING-SOT-001
    statement: >-
      The component manifests are the only inventory. Adding a component means
      creating one directory; bundle.yml and every catalog derive from it and
      drift is a build failure.
    priority: must
    owner: bundle maintainer
    release: "0.1.1"
    status: verified
    components:
      - script:scripts/lib/inventory.py
      - script:scripts/generate_manifests.py
      - script:scripts/generate_catalogs.py
    verified_by:
      - "tests/test_inventory.py::test_finds_every_component_directory"
      - "tests/test_generated_artifacts.py::test_generated_output_is_current[generate_manifests.py]"
      - "tests/test_generated_artifacts.py::test_generated_output_is_current[generate_catalogs.py]"

  - id: REQ-TOOLING-CHECKS-001
    statement: >-
      Every registered source check can be shown to fail on a violation of the
      invariant it guards. A check that silently stopped working must not be
      indistinguishable from one that passes.
    priority: must
    owner: bundle maintainer
    release: "0.1.1"
    status: verified
    components:
      - script:scripts/lib/registry.py
      - script:scripts/lib/checks.py
    verified_by:
      - "tests/test_check_negatives.py::test_every_check_has_a_negative_case"
      - "tests/test_validator.py::test_every_registered_check_executes"

  - id: REQ-TOOLING-POLICY-001
    statement: >-
      Canonical policy is mirrored byte-identically into the installable preset,
      so what governs the source is what reaches the user.
    priority: must
    owner: engineering governance owner
    release: "0.1.1"
    status: verified
    components:
      - policy:framework.yml
      - policy:state-machine.yml
      - check:INV-POLICY-MIRROR
    verified_by:
      - "tests/test_check_negatives.py::test_check_detects_its_own_violation[INV-POLICY-MIRROR]"

  # --- security --------------------------------------------------------------

  - id: REQ-SECURITY-WRITEEFFECT-001
    statement: >-
      The list of write-effect commands is checked against the source rather
      than maintained by hand. Every shipped script that can reach a mutating
      GitHub call must back at least one declared write-effect command. The
      check is script-granular, not command-granular: a script backing two
      commands where only one writes satisfies it on the strength of the
      writer, so a second undeclared command on the same script would pass.
      Reachability is resolved by which function is called across a module
      boundary, not by which module is imported, because import closure alone
      names modules that only use a writer's read-only functions.
    priority: must
    owner: framework
    release: "0.3.0"
    status: verified
    components:
      - script:tooling/invariants.yml
    verified_by:
      - "tests/test_check_negatives.py::test_check_detects_its_own_violation[SEC-WRITE-EFFECT-DECLARED]"

  - id: REQ-SECURITY-EXEMPTION-001
    statement: >-
      A read-only exemption suppresses an approval gate only when it survives
      checking. The step it names must exist in the workflow it names, must
      invoke the command the exemption claims, and must say in its own
      instruction that it writes nothing. An exemption failing any of those is
      reported and suppresses nothing, because two lines of configuration that
      disable a security gate with no way to tell whether the claim is true is
      a bypass rather than an exemption.
    priority: must
    owner: framework
    release: "0.3.0"
    status: verified
    components:
      - script:tooling/invariants.yml
    verified_by:
      - "tests/test_check_negatives.py::test_check_detects_its_own_violation[SEC-EXEMPTION-TRUTHFUL]"

  - id: REQ-SECURITY-SHELL-001
    statement: >-
      Workflow shell steps run only allowlisted commands and interpolate
      nothing. Neither workflow inputs nor agent output can decide what
      executes.
    priority: must
    owner: security reviewer
    release: "0.1.1"
    status: verified
    components:
      - check:SEC-SHELL-ALLOWLIST
      - check:SEC-SHELL-NO-INTERPOLATION
      - policy:agent-policy.yml
    verified_by:
      - "tests/test_check_negatives.py::test_check_detects_its_own_violation[SEC-SHELL-ALLOWLIST]"
      - "tests/test_check_negatives.py::test_check_detects_its_own_violation[SEC-SHELL-NO-INTERPOLATION]"
      - "tests/test_check_negatives.py::test_check_detects_a_violation_nested_in_a_switch_case"

  - id: REQ-SECURITY-GATE-001
    statement: >-
      Every step that mutates external state is preceded by a human approval
      gate, and every gate can represent an undecided verdict rather than
      defaulting to approval.
    priority: must
    owner: security reviewer
    release: "0.1.1"
    status: verified
    components:
      - check:SEC-WRITE-BEHIND-GATE
      - check:INV-GATE-VERDICT
    verified_by:
      - "tests/test_check_negatives.py::test_check_detects_its_own_violation[SEC-WRITE-BEHIND-GATE]"
      - "tests/test_check_negatives.py::test_check_detects_its_own_violation[INV-GATE-VERDICT]"
      - "tests/test_check_negatives.py::test_check_detects_a_violation_nested_in_a_switch_case"

  - id: REQ-SECURITY-EXTCONFIG-001
    statement: >-
      The extension ships safe configuration defaults, and its config target
      uses a name Spec Kit preserves across updates.
    priority: must
    owner: security reviewer
    release: "0.1.1"
    status: verified
    components:
      - extension:github-lifecycle
      - check:SEC-EXTENSION-CONFIG-SAFETY
      - check:INV-EXTENSION-CONFIG-NAME
    verified_by:
      - "tests/test_check_negatives.py::test_check_detects_its_own_violation[SEC-EXTENSION-CONFIG-SAFETY]"
      - "tests/test_check_negatives.py::test_check_detects_its_own_violation[INV-EXTENSION-CONFIG-NAME]"

  # --- GitHub and state ------------------------------------------------------

  - id: REQ-GITHUB-TRANSITION-001
    statement: >-
      A lifecycle transition applies a change a prior step planned and a human
      approved. It names the approved plan, and the plan path must match one a
      previous step actually wrote.
    priority: must
    owner: GitHub integration engineer
    release: "0.1.1"
    status: verified
    components:
      - command:speckit.github-lifecycle.transition
      - check:SEC-TRANSITION-CONTRACT
    verified_by:
      - "tests/test_check_negatives.py::test_check_detects_its_own_violation[SEC-TRANSITION-CONTRACT]"

  - id: REQ-GITHUB-ADAPTER-001
    statement: >-
      GitHub access goes through one adapter that distinguishes the failures a
      caller must handle, retries only what is safe to retry, refuses to apply a
      mutation twice, and can describe a mutation without performing it.
    priority: must
    owner: GitHub integration engineer
    release: "0.2.0"
    status: verified
    components:
      - extension:github-lifecycle
      - script:bundle/components/extensions/github-lifecycle/scripts/github_api.py
    verified_by:
      - "tests/test_github_api.py::test_failures_are_classified_not_stringly_typed"
      - "tests/test_github_api.py::test_reads_retry_until_they_succeed"
      - "tests/test_github_api.py::test_a_mutation_without_an_operation_id_is_never_retried"
      - "tests/test_github_api.py::test_a_mutation_with_an_operation_id_may_retry"
      - "tests/test_github_api.py::test_the_same_operation_id_is_not_applied_twice"
      - "tests/test_github_api.py::test_dry_run_performs_no_mutation_but_reports_it"
      - "tests/test_github_api.py::test_graphql_errors_in_a_200_body_are_raised"

  - id: REQ-SECURITY-AUDIT-001
    statement: >-
      Every GitHub operation is recorded, and no credential reaches the audit
      trail or an error message.
    priority: must
    owner: security reviewer
    release: "0.2.0"
    status: verified
    components:
      - script:bundle/components/extensions/github-lifecycle/scripts/github_api.py
      - policy:agent-policy.yml
    verified_by:
      - "tests/test_github_api.py::test_secrets_never_reach_the_audit_log"
      - "tests/test_github_api.py::test_the_exception_message_is_redacted_too"
      - "tests/test_github_api.py::test_every_call_is_audited"
      - "tests/test_github_api.py::test_every_free_text_audit_field_is_redacted"

  - id: REQ-GITHUB-INSPECT-001
    statement: >-
      Inspection probes what a target supports rather than assuming it, selects
      a field backend, resolves fields and options to stable ids rather than
      display names, and refuses to proceed when the target is ambiguous.
    priority: must
    owner: GitHub integration engineer
    release: "0.2.0"
    status: verified
    components:
      - extension:github-lifecycle
      - policy:github-schema.yml
      - script:bundle/components/extensions/github-lifecycle/scripts/inspect_target.py
    verified_by:
      - "tests/test_inspect.py::test_delivery_state_is_found_in_the_builtin_status_field"
      - "tests/test_inspect.py::test_a_status_field_holding_the_wrong_options_is_not_the_delivery_state"
      - "tests/test_inspect.py::test_user_owner_uses_the_project_backend"
      - "tests/test_inspect.py::test_organization_issue_fields_win_when_they_carry_the_state"
      - "tests/test_inspect.py::test_multiple_projects_are_an_ambiguity_not_a_choice"
      - "tests/test_inspect.py::test_fields_and_options_resolve_to_ids_not_names"
      - "tests/test_inspect.py::test_inspection_never_mutates"

  - id: REQ-GITHUB-FIELDS-001
    statement: >-
      Lifecycle field values are read and written through one interface that
      callers use without knowing which backend answered. Values are addressed
      by option id rather than display name, and labels are never written.
    priority: must
    owner: GitHub integration engineer
    release: "0.2.0"
    status: verified
    components:
      - extension:github-lifecycle
      - policy:github-schema.yml
      - script:bundle/components/extensions/github-lifecycle/scripts/field_backend.py
    verified_by:
      - "tests/test_field_backend.py::test_a_written_value_reads_back_by_name"
      - "tests/test_field_backend.py::test_writes_send_an_option_id_not_a_display_name"
      - "tests/test_field_backend.py::test_no_operation_ever_touches_labels"
      - "tests/test_field_backend.py::test_replaying_an_operation_id_does_not_write_again"
      - "tests/test_field_backend.py::test_dry_run_reports_the_intent_and_writes_nothing"
      - "tests/test_field_backend.py::test_an_unset_field_reads_as_none"
      - "tests/test_field_backend.py::test_selection_returns_the_backend_the_inspection_chose"

  - id: REQ-GITHUB-ORGFIELDS-001
    statement: >-
      Where an organization has opted into Issue Fields carrying the delivery
      state, they are used through the same interface and with the same
      read-back guarantee as the project backend.
    priority: should
    owner: GitHub integration engineer
    release: "0.2.0"
    status: verified
    components:
      - extension:github-lifecycle
      - policy:github-schema.yml
      - script:bundle/components/extensions/github-lifecycle/scripts/field_backend.py
    verified_by:
      - "tests/test_field_backend.py::test_org_backend_round_trips_a_value"
      - "tests/test_field_backend.py::test_org_backend_sends_the_option_name_not_its_id"
      - "tests/test_field_backend.py::test_org_backend_uses_field_id_not_id_in_the_payload"
      - "tests/test_field_backend.py::test_org_backend_never_touches_a_project"
      - "tests/test_field_backend.py::test_the_field_id_key_is_issue_field_id"
      - "tests/test_field_backend.py::test_the_earlier_key_guesses_still_resolve"
      - "tests/test_field_backend.py::test_a_single_select_reads_its_name_not_its_option_id"
      - "tests/test_field_backend.py::test_a_field_with_no_option_falls_back_to_the_plain_value"
      - "tests/test_field_backend.py::test_the_projects_reader_is_not_used_for_issue_fields"
    evidence:
      - "docs/evidence/orgfields-round-trip.md"
      - "Issue #37"

  - id: REQ-GITHUB-TRANSITION-002
    statement: >-
      A lifecycle transition is planned before it is applied, validated against
      the state machine, evidenced as that transition's authority requires, and
      refused if the value has changed since the plan observed it.
    priority: must
    owner: GitHub integration engineer
    release: "0.2.0"
    status: verified
    components:
      - extension:github-lifecycle
      - policy:state-machine.yml
      - script:bundle/components/extensions/github-lifecycle/scripts/transition_plan.py
    verified_by:
      - "tests/test_transition.py::test_a_legal_transition_plans"
      - "tests/test_transition.py::test_an_illegal_edge_is_refused_with_the_legal_ones_named"
      - "tests/test_transition.py::test_missing_evidence_refuses_the_write"
      - "tests/test_transition.py::test_a_stale_plan_will_not_overwrite_someone_elses_change"
      - "tests/test_transition.py::test_applying_moves_the_value_and_reads_it_back"
      - "tests/test_transition.py::test_reapplying_the_same_plan_is_idempotent"
      - "tests/test_transition.py::test_a_plan_round_trips_through_markdown"
      - "tests/test_transition.py::test_evidence_asserted_as_false_is_refused"
      - "tests/test_transition.py::test_an_empty_evidence_value_is_refused"
      - "tests/test_transition.py::test_output_done_asks_for_one_thing_nobody_can_derive"
      - "tests/test_transition.py::test_a_transition_refuses_when_the_board_moved_since_approval"
      - "tests/test_transition.py::test_reapplying_a_finished_transition_changes_nothing"
      - "tests/test_transition.py::test_no_workflow_writes_or_reads_a_transition_plan_file"
  - id: REQ-GITHUB-COMMANDS-001
    statement: >-
      A command that reaches GitHub invokes the deterministic adapter rather
      than describing the calls, so the agent decides what to report and when
      to stop, never how to reach the API.
    priority: must
    owner: GitHub integration engineer
    release: "0.2.0"
    status: verified
    components:
      - extension:github-lifecycle
      - command:speckit.github-lifecycle.inspect
      - command:speckit.github-lifecycle.plan
      - command:speckit.github-lifecycle.transition
      - check:SEC-COMMAND-SCRIPT-BACKED
    verified_by:
      - "tests/test_check_negatives.py::test_every_check_has_a_negative_case"
      - "tests/test_check_negatives.py::test_check_detects_its_own_violation"

  - id: REQ-GITHUB-RELATIONSHIPS-001
    statement: >-
      Hierarchy and dependency links are created idempotently and read back,
      and any link that would make an item its own ancestor is refused before
      it is written.
    priority: must
    owner: GitHub integration engineer
    release: "0.2.0"
    status: verified
    components:
      - extension:github-lifecycle
      - script:bundle/components/extensions/github-lifecycle/scripts/relationships.py
    verified_by:
      - "tests/test_relationships.py::test_a_child_is_linked_and_read_back"
      - "tests/test_relationships.py::test_a_link_that_does_not_take_is_a_conflict"
      - "tests/test_relationships.py::test_linking_twice_writes_once"
      - "tests/test_relationships.py::test_an_item_cannot_parent_itself"
      - "tests/test_relationships.py::test_a_direct_cycle_is_refused_before_any_write"
      - "tests/test_relationships.py::test_an_indirect_cycle_is_refused"
      - "tests/test_relationships.py::test_a_dependency_may_cross_repositories"

  - id: REQ-GITHUB-READBACK-001
    statement: >-
      Every write is read back before it is reported as done. A write whose
      read-back disagrees is a conflict, not a success.
    priority: must
    owner: GitHub integration engineer
    release: "0.2.0"
    status: verified
    components:
      - extension:github-lifecycle
      - policy:github-schema.yml
      - script:bundle/components/extensions/github-lifecycle/scripts/field_backend.py
    verified_by:
      - "tests/test_field_backend.py::test_a_write_that_does_not_stick_raises_conflict"
      - "tests/test_field_backend.py::test_write_returns_the_value_it_verified"
      - "tests/test_field_backend.py::test_replaying_an_id_after_the_value_moved_on_is_a_conflict"

  - id: REQ-STATE-RETIRED-001
    statement: >-
      Retirement has a terminal state to reach. An item abandoned at any live
      state can move to Retired, and nothing follows Retired: reviving
      abandoned work is a new item, not a reopening. The delivery state is
      written by transition and not by retire, so a retirement is two audited
      steps rather than one command with a second unaudited write path. States
      that assert work are read from the machine's declared terminal states,
      not counted from the end of its values list, so adding a terminal state
      does not silently make the previous one assert work.
    priority: must
    owner: framework
    release: "0.3.0"
    status: verified
    components:
      - policy:state-machine.yml
      - command:speckit.github-lifecycle.retire
    verified_by:
      - "tests/test_transition.py::test_retired_is_a_declared_terminal_state"
      - "tests/test_transition.py::test_every_live_state_can_reach_retired[Inbox]"
      - "tests/test_transition.py::test_every_live_state_can_reach_retired[Refining]"
      - "tests/test_transition.py::test_every_live_state_can_reach_retired[Ready]"
      - "tests/test_transition.py::test_every_live_state_can_reach_retired[In Progress]"
      - "tests/test_transition.py::test_nothing_follows_retired"
      - "tests/test_transition.py::test_a_terminal_state_does_not_assert_work"
      - "tests/test_transition.py::test_asserting_work_is_read_from_the_machine_not_counted_from_the_end"

  - id: REQ-STATE-OUTPUT-001
    statement: >-
      Output Done and Outcome Status are independent. Completing engineering
      work never sets an outcome, and an unvalidated outcome never reopens
      completed work.
    priority: must
    owner: product/process owner
    release: "0.2.0"
    status: verified
    components:
      - policy:state-machine.yml
      - policy:outcome-policy.yml
    verified_by:
