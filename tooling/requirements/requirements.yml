  - id: REQ-BACKLOG-AUDIT-002
    statement: >-
      A parent's delivery state must be consistent with its children's, and one
      rule decides that. A parent at Output Done over a child that is not
      delivered is reported whatever its type, because nothing is complete
      while part of it is not. The remaining angles apply to epics only, whose
      progress derives from their children rather than being an independent
      fact: an epic is reported when it claims less than its children show
      (below In Progress while a child has started or finished, or below Output
      Done while every child is delivered) and when it claims more than they
      support (In Progress while no child can move). A child is judged movable
      unless it is delivered or has an unresolved blocker, so refinement counts
      as progress. The order of the states is read from the state machine
      rather than compiled into the audit, an epic with no children is left to
      decomposition, and a non-epic parent is never judged by the epic-only
      angles.
