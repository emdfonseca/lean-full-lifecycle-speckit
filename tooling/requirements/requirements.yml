  - id: REQ-GITHUB-BOARD-002
    statement: >-
      Placing an item on the board also sets the delivery state a new item
      enters, because a board row without one is reported by the audit, skipped
      by the refinement queue, and cannot be planned from. The state is read
      from the state machine's edge from no state rather than compiled into the
      command. A placement that succeeds while the state write fails reports
      that rather than reading as a clean creation, and a backend with no board
      is not asked for a state at all.
    priority: must
    owner: framework
    release: "0.3.0"
    status: verified
    components:
      - command:speckit.github-lifecycle.capture
      - policy:state-machine.yml
      - script:bundle/components/extensions/github-lifecycle/scripts/capture.py
