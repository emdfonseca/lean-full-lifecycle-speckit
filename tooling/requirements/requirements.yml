  - id: REQ-SECURITY-ORGSCHEMA-001
    statement: >-
      The bundle performs no organization Issue Field schema mutation, and that
      is checked rather than asserted. Reading an organization's issue fields
      is how the backend discovers whether a delivery-state field exists and
      stays permitted; writing to that collection is what no script does. The
      claim replaced a config default, allow_organization_schema_mutation,
      which no code read: a switch that gates nothing is the same defect as a
      scenario that exercises nothing, and the honest form of the promise is a
      check that the path is absent. docs/security.md states the fact rather
      than a guarantee, and the credential-separation advice is marked as
      advice the bundle cannot enforce because it has no schema-administration
      path to gate.
