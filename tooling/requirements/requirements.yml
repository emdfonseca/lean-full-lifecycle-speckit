      - "tests/test_git_dependency.py::test_git_is_declared_optional_and_says_what_its_absence_costs"
    evidence:
      - "Issue #157"
  - id: REQ-PRODUCT-DOCUMENTS-005
    statement: >-
      The decision-record directory is declared as an ordered candidate list in
      bootstrap-policy.yml and resolved against the project tree, rather than
      named as a literal in the prose that instructs a writer. It was
      docs/decisions/, which is this repository's own directory, so a target
      keeping five Nygard ADRs in docs/adr/ was invisible and the architecture
      document would have delegated arc42 section 9 to a directory the project
      does not have. A candidate directory holds records when it contains a
      Markdown file, since an empty directory is one somebody made rather than
      a set of decisions the project keeps. Exactly one such directory
      resolves to it. Two are reported and not ranked, because which set of
      decisions is authoritative is a person's call; that report is a problem
      the check returns. None resolves to the first declared candidate and
      says so, since a project with no records has made no choice to discover.
      Preference order therefore decides only the empty case. What is refused
      is the fixed path in the two instructions to a writer, the architecture
      delegation and the decision-log per_entry rule; the rationale comment
      above them still names this repository's own directory, which is history
      and not an instruction.
    priority: must
    owner: product/process owner
    release: "0.3.0"
    status: verified
    components:
      - policy:bootstrap-policy.yml
      - script:bundle/components/extensions/github-lifecycle/scripts/documents.py
    verified_by:
      - "tests/test_documents.py::test_the_decision_record_directory_is_declared_as_ordered_candidates"
      - "tests/test_documents.py::test_no_writer_instruction_names_a_fixed_decision_directory"
      - "tests/test_documents.py::test_records_kept_in_docs_adr_are_found_there"
      - "tests/test_documents.py::test_records_kept_in_docs_decisions_are_still_found_there"
      - "tests/test_documents.py::test_two_candidate_directories_are_reported_not_ranked"
      - "tests/test_documents.py::test_a_project_with_no_records_is_told_where_they_will_go"
      - "tests/test_documents.py::test_an_empty_candidate_directory_holds_no_records"
    evidence:
      - "Issue #141"
      - "Issue #104"

  - id: REQ-PRODUCT-DOCUMENTS-004
    statement: >-
      Every declared document says when it was last verified and by what
      change, and two documents the framework already required are declared.
      Nothing made a stale document visible, so one that had stopped being true
      read exactly like one that is; the stamp carries a change id as well as a
      date, because a date alone records that somebody typed a date. A date in
      the future is refused rather than reported, since nothing can contradict
      it and it therefore claims freshness permanently. A runbook is declared
      because artifact-policy.yml already gives one authority
      authoritative_operational and Output Done requires operability
      discharged, while no contract asked anyone to write it: a required
      artifact nobody is asked for is a gap that appears only at the gate. A
      domain document is declared for the project's vocabulary, and its third
      column, what a term does not mean, is what earns it. What a project
      deliberately does not test is a section rather than a document, because
      the rest of a testing document restates quality-gates.yml and a second
      copy is the one that drifts.
    priority: must
    owner: product/process owner
    release: "0.3.0"
    status: verified
    components:
      - policy:bootstrap-policy.yml
      - script:bundle/components/extensions/github-lifecycle/scripts/documents.py
    verified_by:
      - "tests/test_documents.py::test_a_document_with_no_stamp_is_reported"
      - "tests/test_documents.py::test_a_stamped_document_passes"
      - "tests/test_documents.py::test_a_future_stamp_is_refused"
      - "tests/test_documents.py::test_a_date_without_a_change_id_is_not_a_stamp"
      - "tests/test_documents.py::test_a_runbook_is_declared"
      - "tests/test_documents.py::test_the_domain_document_asks_what_a_word_does_not_mean"
      - "tests/test_documents.py::test_deliberately_untested_is_a_section_not_a_document"
    evidence:
      - "Issue #137"
      - "Issue #103"

  - id: REQ-PRODUCT-DOCUMENTS-002
    statement: >-
      The per-principle preamble count reads structure, not physical lines. A
      list item, table row, or block quote carries the lines it wraps onto, so
      a principle that is a list of bullets and no paragraph at all passes
      however its bullets wrap. Counting continuation lines as prose made the
      passing shape depend on the wrap column, which no policy states and no
      author can infer from the message. Any ordinal opens a list item, not
      just `1.`: exempting the first alone made the second and third steps of
      a numbered cycle read as an explanatory paragraph. Prose lines are still
      counted one by one, because a rule statement that runs to two lines is
      the thing the count exists to catch.
    priority: must
    owner: framework
    release: "0.3.0"
    status: verified
    components:
      - policy:bootstrap-policy.yml
      - script:bundle/components/extensions/github-lifecycle/scripts/documents.py
    verified_by:
      - "tests/test_documents.py::test_a_bullet_that_wraps_before_its_keyword_passes"
      - "tests/test_documents.py::test_a_wrapped_rule_statement_is_still_two_lines_of_prose"
      - "tests/test_documents.py::test_every_ordinal_is_a_list_item_not_just_the_first"
      - "tests/test_documents.py::test_a_wrapped_table_row_is_not_prose"
    evidence:
      - "Issue #127"
      - "Issue #104"

  - id: REQ-PRODUCT-DOCUMENTS-001
    statement: >-
      The documents a bootstrapped project must have are declared in policy, not
      in one workflow's prompt: a set that lives in prose is a convention, and
      the workflow that did not read that prose omitted four of five while
      writing hundreds of lines about what the code does. Each section declares what it answers and
      what form it takes. Length is not budgeted: a line count is wrong for
      somebody, and the first attempt set a constitution at 200 lines, which
      would have meant deleting principles from a real one. Form is checked
      instead and scales on its own -- a table with one row per fact cannot
      ramble however large the project. A section that is empty, or in a form
      the contract did not ask for, is reported. Section names follow named
      standards rather than invented ones: arc42 for architecture, tailored
      and delegating its decision section to the ADRs the project already
      keeps; the Nygard ADR shape for decision records; RFC 2119 keywords in
      the constitution. Both bootstrap routes produce the same set with the
      same sections, since a reader moving between projects should not have
      to learn two shapes. A constitution's principles are checked one by one:
      each states something normative in RFC 2119 terms and states it first,
      because a principle with no MUST is an opinion and an explanatory
      paragraph in front of a rule means the rule is not yet written. Architecture carries observation and decision as separate named
      sections, since the gap between them is where specs come from. Every
      workflow that bootstraps or adopts produces the whole set, and no
      shipped surface instructs a budget the policy does not declare.
    priority: must
    owner: product/process owner
    release: "0.3.0"
    status: verified
    components:
      - command:speckit.github-lifecycle.documents
      - policy:bootstrap-policy.yml
      - check:INV-BOOTSTRAP-DOCUMENTS
      - workflow:lifecycle-brownfield-adoption
      - workflow:lifecycle-greenfield-bootstrap
    verified_by:
