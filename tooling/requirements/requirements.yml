  - id: REQ-TOOLING-HARNESS-001
    statement: >-
      A workflow must be runnable in the suite without a model, so its
      behaviour can be tested rather than its text read. Steps are visited in
      order, a rejected gate aborts the run and nothing after it executes, an
      unscripted gate is an error rather than an approval, a command step
      executes the real script and its refusal stops the run, a command with no
      supplied invocation is recorded rather than invented, prompt steps are
      recorded and never reported as executed, and a workflow missing an
      expected step fails the run by name.
