  - id: REQ-SECURITY-UNTRUSTED-001
    statement: >-
      agent-policy.yml's untrusted input lists are read rather than shipped as
      prose. No workflow step interpolates a source the policy names untrusted
      into a command's argument string or prompt, checked in parallel to the
      existing shell-interpolation rule; the issue reference remains usable,
      because what is untrusted is the content and not the address. Of the
      eight actions untrusted input may never authorize, those with a
      permission primitive become generated deny rules and the rest are
      reported as unenforced rather than approximated, so the configuration is
      never read as stricter than it is. The shell is not denied outright: it
      is already ask, and denying it would stop the workflows the bundle ships.
    priority: must
    owner: framework
