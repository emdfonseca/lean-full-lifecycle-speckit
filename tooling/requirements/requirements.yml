  - id: REQ-STATE-OUTCOME-002
    statement: >-
      An outcome record must carry the evidence its status depends on, and the
      assessment must refuse to conclude more than that evidence supports. A
      regressed guardrail defeats a met target; a missed target and an
      inconclusive one are reported as different findings even though they
      share one status; insufficient evidence leaves the item Measuring rather
      than missed; an unreadable data source blocks; and only a named
      authority may record Outcome Validated.
    priority: must
    owner: framework
    release: "0.2.0"
    status: verified
    components:
      - extension:github-lifecycle
      - command:speckit.github-lifecycle.outcome
      - policy:outcome-policy.yml
