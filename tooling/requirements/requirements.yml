  - id: REQ-CORE-VERIFYCMD-002
    statement: >-
      A stack decision is recognised by what a document records, not by the
      document existing. The precondition on generating a verification script
      tested that one declared source was present and non-empty, and every
      bootstrap writes a constitution, so it cleared on every project: the
      guard against inventing a project's toolchain was satisfied by the
      document that was meant to contain the answer. Each source now declares
      the section that records the decision, so the constitution stays a
      source, because a real one records its tooling choices, while one that
      names no language, runtime, or test command no longer counts. A declared
      heading with nothing beneath it is not a decision either, which is the
      same failure one level down.
    priority: must
    owner: framework
    release: "0.3.0"
    status: verified
    components:
      - policy:bootstrap-policy.yml
