  - id: REQ-RELEASE-LADDER-001
    statement: >-
      The release ladder is observable. The roadmap declares five releases,
      each with an exit condition, and version coherence keeps every component
      on the bundle's version -- but nothing required the number to ever move,
      so four rungs' worth of verified work accumulated under the 0.1.0 the
      repository started at. Only the next rung is considered: reporting every
      fully verified release would ask for a jump to 0.9.0 while three pilot
      streams are open, and a ladder is climbed in order. What the check knows
      is requirement status, and a roadmap exit condition can require more --
      0.9.0 asks for four completed pilots, which no status field records --
      so it warns rather than refuses and leaves cutting a release to a
      person. A rung whose requirements are not all verified is silent, because
      pushing a release whose exit condition is unmet is the same failure in
      the other direction.
    priority: should
    owner: bundle maintainer
    release: "0.3.0"
    status: verified
    components:
      - script:scripts/lib/checks.py
    verified_by:
      - "tests/test_check_negatives.py::test_currently_violated_check_fires_on_clean_source[INV-RELEASE-LADDER]"
      - "tests/test_check_negatives.py::test_every_check_has_a_negative_case"
    evidence:
