# Invariants this bundle chooses to hold, as data rather than literals buried
# in the validator. Adding a workflow must not mean editing Python.
schema_version: "1.0"

# The only shell commands a workflow step may run. Workflows call fixed
# verification entry points in the target project; anything else would let a
# workflow define arbitrary execution.
allowed_shell:
  - devbox run verify
  - devbox run release-verify

# Commands that mutate GitHub state. Each must be preceded by a plan step and a
# human gate, and must name the approved plan it is applying.
write_effect_commands:
  - speckit.github-lifecycle.transition
  - speckit.github-lifecycle.capture
  - speckit.github-lifecycle.link
  # retire.py PATCHes an issue to closed and POSTs its reason; restructure.py
  # reaches both create_item and retire. Neither appears as a step in any
  # workflow today, so declaring them changes no gating -- it stops the list
  # being a subset of what writes, which is the only thing that made it
  # load-bearing.
  - speckit.github-lifecycle.retire
  - speckit.github-lifecycle.restructure
  # decompose.py reaches capture_mod.create_item and relationships.link_child.
  # Its writing step, `create-children`, already sits behind `approve-proposals`.
  # Its other invocation, `read-horizon`, is read-only and is exempted below.
  - speckit.github-lifecycle.decompose

# An exemption is honoured only when the step it names says, in its own
# instruction, that it writes nothing -- SEC-EXEMPTION-TRUTHFUL refuses one that
# does not. Without that, two lines here would disable an approval gate and
# nobody could tell whether the claim was true.
read_only_invocations:
  - workflow: lifecycle-outcome-review
    step: search-for-an-existing-finding
    command: speckit.github-lifecycle.capture
  - workflow: lifecycle-decompose
    step: read-horizon
    command: speckit.github-lifecycle.decompose

plan_command: speckit.github-lifecycle.plan

# Commands that reach GitHub must invoke a script rather than describe the
# calls. Prose leaves the agent to decide how to reach the API, which is the
# freedom the deterministic adapter exists to remove.
#
# Settled in #48: capture and link are kept. Upstream speckit.taskstoissues
# converts a feature's tasks.md into issues, which is implementation
# decomposition inside a feature -- a different job from capturing a finding
# into the backlog, and from managing hierarchy.
script_backed_commands:
  - inspect
  - plan
  - transition
  - readiness
  - capture
  - link
  - decompose
  - triage
  - discover
  - disposal
  - mismatch
  - claude-config
  - opencode-config
  - opencode-layout
  - models
  - ratchet
  - sensitive
  - exception
  - verify-bootstrap
  - outcome
  - doctor

# Safety keys the extension config template must declare, with required values.
# These are the defaults a user inherits; relaxing one is a deliberate act, not
# an accident of editing the template.
extension_config_safety:
  # No GitHub write without an approved plan, and every write is read back.
  require_approved_plan_for_write: true
  require_read_back: true
  # Output Done is an explicit engineering verdict. Closing an issue by any
  # other route must never be taken to mean the work is done.
  infer_output_done_from_closed_issue: false

# Spec Kit has no sub-workflow step, so a branch that mirrors a standalone
# workflow must inline its steps and the sequence exists twice. The roadmap
# offered two remedies for that under "Avoiding workflow drift": generate both
# from shared fragments, or test them for semantic parity. P0d chose parity,
# because a generator hides hand-written prompt prose behind a template layer
# and doubles the review surface.
#
# This is where that choice is paid for. Parity compares the sequence of step
# kinds and commands after normalisation; prose is deliberately not compared,
# since the embedded branch addresses a story already in flight and the
# standalone one does not.
parity:
  - standalone: lifecycle-discover
    embedded_in: lifecycle-story-delivery
    case: discovery
    standalone_trailing_steps: 0
  - standalone: lifecycle-prototype
    embedded_in: lifecycle-story-delivery
    case: prototype
    standalone_trailing_steps: 0
  - standalone: lifecycle-spike
    embedded_in: lifecycle-story-delivery
    case: spike
    standalone_trailing_steps: 0

# A workflow must not name an agent. Spec Kit resolves `auto` to the project's
# configured integration at run time; a specific default means a project
# initialized with another agent still dispatches to this one.
integration_default: auto
