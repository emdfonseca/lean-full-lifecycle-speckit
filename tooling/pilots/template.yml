# Copy to docs/evidence/pilot-<stream>.md and fill in during the run.
# Validate with: python tooling/pilots/pilot_record.py --record <path>
stream: greenfield          # greenfield | brownfield | monorepo | sandbox-org
owner:                      # the named pilot owner. Required by the 0.9.0 gate.
target:                     # repository or project the pilot ran against
started:
finished:

metrics:
  workflow_completion_without_repair: {value: null, why: }
  human_interventions: {value: null, why: }
  incorrect_or_out_of_scope_edits: {value: null, why: }
  readiness_accuracy: {value: null, why: }
  duplicate_backlog_rate: {value: null, why: }
  convergence_findings: {value: null, why: }
  ready_to_output_done_hours: {value: null, why: }
  failed_github_operations: {value: null, why: }
  model_cost: {value: null, why: }
  model_runtime_minutes: {value: null, why: }
  test_flakiness: {value: null, why: }
  developer_satisfaction: {value: null, why: }
  generated_artifacts_disposed: {value: null, why: }

# Every failure becomes a backlog item. One that does not is a finding the
# pilot lost.
failures: []
#  - what: the workflow could not resolve the project root from a worktree
